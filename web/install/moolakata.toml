# MoolaKata's configuration (requirements S13.3, S15.4). Mounted read only at
# /etc/moolakata.toml. It never holds a secret: those are in the database, encrypted (S14.4), and the master key
# is a recovery phrase entered when the server starts, never a file.

[server]
# Shown in logs and the self-signed certificate. The name linked servers see is set in
# Settings › General.
name = "moolakata"
# "proxy": plain HTTP behind the household's reverse proxy, which ends TLS. "tls": MoolaKata's
# own HTTPS with HTTP/2, with the certificate under [tls], or with none its own self-signed
# one, which is for testing on a local network.
mode = "proxy"
port = 37373
# The reverse proxy's own address: X-Forwarded-For and -Proto are believed only from it. Never
# a whole range (S13.3): anything else in it could pose as the proxy. 172.30.37.10 is the proxy
# service of compose.yaml; a proxy on the host comes from the bridge's gateway, 172.30.37.1.
trusted_proxies = ["172.30.37.10"]

[paths]
data = "/var/lib/moolakata"
backups = "/var/backups/moolakata"
# socket = "/run/moolakata/sock"   where host commands reach the running server (S13.6): a
#                                  directory of the server's account alone, as compose.yaml's tmpfs

# [tls]   in "tls" mode: a certificate and key, for real use; without them, a self-signed pair
# cert = "/etc/moolakata/tls/fullchain.pem"   is made on first start and kept in the data
#                                             directory, for testing.
# key = "/etc/moolakata/tls/privkey.pem"
# names = ["money.lan", "192.168.1.20"]   what browsers use to reach it, for the self-signed
#                                         certificate (it always names the server and localhost)
