# MoolaKata behind the household's reverse proxy (requirements S17.8). Start from this file:
#   1. make the directories:   mkdir -p data backups && sudo chown 10001:10001 data backups
#   2. start:                  docker compose up -d
#   3. open the app: its welcome shows the recovery phrase, which is the master key and is
#      never stored (write it down, S15.6), then sets up the first admin (S15.4.4)
#   4. unlock after every restart, in the app or with
#                              docker compose exec moolakata moolakata keys unlock
# Put a reverse proxy (proxy/ has Caddy, nginx and haproxy examples) in front of port 37373.

services:
  moolakata:
    image: ghcr.io/mojokata/moolakata:0.1.0
    restart: unless-stopped   # back after every reboot, locked; a refused start (exit 78)
                              # is retried at most once a minute (S13.6)
    # Plain HTTP in proxy mode, so it is published on the host's loopback only: a proxy on
    # the host reaches 127.0.0.1:37373, and one in this compose project reaches
    # moolakata:37373 by name (proxy/) with no published port needed at all.
    ports:
      - "127.0.0.1:37373:37373"
    volumes:
      - ./data:/var/lib/moolakata
      - ./backups:/var/backups/moolakata
      - ./moolakata.toml:/etc/moolakata.toml:ro
      - /etc/localtime:/etc/localtime:ro   # the host's time zone, which backups and emails follow
    environment:
      TZ: ${TZ:-}   # or name it here, or in .env beside this file: TZ=America/Denver (S14.9.2)
    read_only: true
    tmpfs:
      - /tmp
      - /run/moolakata:uid=10001,gid=10001,mode=0700   # where host commands reach it (S13.6)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:                # Docker keeps the logs; these bound them (operations.md)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # A reverse proxy in this project (proxy/ has Caddy, nginx and haproxy configurations)
  # reaches moolakata:37373 by name, from the one fixed address that trusted_proxies in
  # moolakata.toml names (S13.3):
  # proxy:
  #   image: caddy:2
  #   ports: ["443:443"]
  #   volumes: ["./proxy/Caddyfile:/etc/caddy/Caddyfile:ro"]
  #   networks:
  #     default: { ipv4_address: 172.30.37.10 }

  # The MoolaKata Connector (S18.10, S18.11): a second service with a volume of its own, which
  # MoolaKata never mounts. It calls out, and publishes one port: its own page, where its vault
  # is made, its words given after every start and its pairing done (operations.md §8).
  connector:
    image: ghcr.io/mojokata/moolakata-connector:0.1.0
    restart: unless-stopped
    ports:
      - "37374:37374"
    environment:
      # The addresses browsers use for its page, separated by commas: its certificate names
      # them, and MoolaKata links to the first. "192.168.1.50", say.
      MOOLAKATA_CONNECTOR_NAMES: ""
    volumes:
      - connector-data:/var/lib/moolakata-connector
    read_only: true
    tmpfs:
      - /tmp
      - /run/moolakata-connector:uid=10002,gid=10002,mode=0700   # its admin socket, inside the container only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  connector-data:

# A fixed range, so that the proxy's address above is known. A proxy on the host itself reaches
# 127.0.0.1:37373 from the bridge's gateway, 172.30.37.1, as every process on the host does.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.37.0/24
