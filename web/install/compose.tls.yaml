# MoolaKata with its own HTTPS listener (requirements S13.3, S17.8.4). Copy moolakata.toml to
# moolakata-tls.toml and set mode = "tls" in it. To try it on a local network, list under
# [tls] names the name or address browsers will use: the server makes a self-signed
# certificate for them, kept in ./data. A server the household relies on is given a
# certificate instead: set [tls] cert and key, and mount their folder (below), kept outside
# ./data; or use compose.yaml behind a reverse proxy. A renewed certificate is read at the next
# start, which starts locked.

services:
  moolakata:
    image: ghcr.io/mojokata/moolakata:0.1.0
    restart: unless-stopped   # back after every reboot, locked (S13.6)
    ports:
      - "37373:37373"
    volumes:
      - ./data:/var/lib/moolakata
      - ./backups:/var/backups/moolakata
      - ./moolakata-tls.toml:/etc/moolakata.toml:ro
      # - ./certs:/etc/moolakata/tls:ro   a given certificate, as [tls] cert and key name it
      - /etc/localtime:/etc/localtime:ro   # the host's time zone, which backups and emails follow
    environment:
      TZ: ${TZ:-}   # or name it here, or in .env beside this file: TZ=America/Denver (S14.9.2)
    read_only: true
    tmpfs:
      - /tmp
      - /run/moolakata:uid=10001,gid=10001,mode=0700   # where host commands reach it (S13.6)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:                # Docker keeps the logs; these bound them (operations.md)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The MoolaKata Connector (S18.10, S18.11): a second service with a volume of its own, which
  # MoolaKata never mounts. It calls out, and publishes one port: its own page, where its vault
  # is made, its words given after every start and its pairing done (operations.md §8).
  connector:
    image: ghcr.io/mojokata/moolakata-connector:0.1.0
    restart: unless-stopped
    ports:
      - "37374:37374"
    environment:
      # The addresses browsers use for its page, separated by commas: its certificate names
      # them, and MoolaKata links to the first. "192.168.1.50", say.
      MOOLAKATA_CONNECTOR_NAMES: ""
    volumes:
      - connector-data:/var/lib/moolakata-connector
    read_only: true
    tmpfs:
      - /tmp
      - /run/moolakata-connector:uid=10002,gid=10002,mode=0700   # its admin socket, inside the container only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  connector-data:
