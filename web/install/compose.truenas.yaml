# MoolaKata as a TrueNAS custom app (requirements S17.8.3, docs/DEPLOY.md §4): paste it into
# Apps › Discover Apps › More Options › Install via YAML. /mnt/tank/moolakata holds the two
# datasets (DEPLOY.md §4.1); use your pool's name in place of tank, and the NAS's address in
# [tls] names. As it is, the server makes a self-signed certificate for that address, which is
# for testing (S13.3). A server the household relies on is given a certificate: put its files
# in a dataset that isn't replicated with the data, readable by uid 10001, uncomment the
# volume marked "given", and add cert and key under [tls] (docs/operations.md §2.2). A renewed
# one is read at the next start.
services:
  # Gives the two datasets to the server's account (uid 10001) before it starts, then ends:
  # root, with the one capability that takes, and no network.
  permissions:
    image: ghcr.io/mojokata/moolakata:0.1.0
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/var/lib/moolakata", "/var/backups/moolakata"]
    volumes:
      - /mnt/tank/moolakata/data:/var/lib/moolakata
      - /mnt/tank/moolakata/backups:/var/backups/moolakata
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  moolakata:
    image: ghcr.io/mojokata/moolakata:0.1.0
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
      - "37373:37373"
    environment:
      # moolakata.toml, given here rather than as a file (S17.8).
      MOOLAKATA_CONFIG: |
        [server]
        name = "moolakata"
        mode = "tls"
        port = 37373

        [paths]
        data = "/var/lib/moolakata"
        backups = "/var/backups/moolakata"

        [tls]
        names = ["192.168.1.20"]
    volumes:
      - /mnt/tank/moolakata/data:/var/lib/moolakata
      - /mnt/tank/moolakata/backups:/var/backups/moolakata
      # - /mnt/tank/certs/moolakata:/etc/moolakata/tls:ro   given
      - /etc/localtime:/etc/localtime:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run/moolakata:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
