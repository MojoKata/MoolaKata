# The path to the end of review 3's sweep (requirements S17.5.8.6): every step, in order. A step
# with a pull request is done once that pull request has merged to main; the hardening page
# shows it checked, with what changed by area at its merge. A step's pull request is added here
# when it is opened. Before a step is signed off, its last CI run's times are checked
# (`web/dev.sh ci-times`, REVIEW.md §11.7), and a job past the budget is split further in it.
#
# kind: "med" for a step that fixes named findings, "sweep" for an area's sweep (its findings,
# coverage and a mutation run over all its modules, every survivor settled), "tracker" for this,
# "tooling" for the tools the sweep runs on.
# areas: the coverage site's areas the step covers; a "med" step's come from its findings.
# gains: for the steps done before the page kept its own history, the coverage gains their pull
# requests reported (lines / branches, in points).

review = "docs/reviews/code-review-0003-2026-10-24.md"

[[step]]
pr = 32
kind = "before"
what = "Values, options, prices and assets: the first mutation runs, every survivor settled"
areas = ["server/core", "server/loans", "server/ledger", "server/options", "server/prices", "server/assets"]
gains = "prices +8.5 / +14.0, options +6.4 / +12.3, loans +2.7 / +6.4, ledger +0.6 / +2.4"

[[step]]
pr = 38
kind = "before"
what = "Taxes, trade routes and item routes: mutation runs settled, and the walk's decisions"
areas = ["server/taxes", "server/options", "server/assets"]
gains = "taxes +1.3 / +3.5, loans +0.3 / +1.3, people +0.2 / +1.0"

[[step]]
pr = 39
kind = "tracker"
what = "The tracker: this page, the mutation records, and this path"

[[step]]
pr = 40
kind = "tooling"
what = "The mutation baseline: every server module's first run on CI, side by side, before the sweeps"

[[step]]
pr = 44
kind = "med"
what = "Med bugs in the server: a rule that can freeze it, an invitation left working, Bitcoin's default source, a key taken out, a savings target"
findings = [25, 49, 20, 62, 31, 452]

[[step]]
pr = 45
kind = "med"
what = "Med: when a statement value is stale, the TrueNAS install's mode, the Reconcile tab"
findings = [8, 12, 17, 308, 453, 454]

[[step]]
kind = "med"
what = "Categories: a walk with the user, then who owns, adds and changes them"
findings = [7, 75]

