<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MoolaKata mockup</title>
<!--
  MoolaKata's clickable mockup (docs/requirements S12.9). One file, opens from disk, sends
  nothing anywhere. Hand-written until web/ui exists; then generated from it by web/ui/mockup/build.py.
  Charts here are small hand-drawn SVGs so the file stays self-contained; the app will use the
  chart library chosen in requirements S16.4.
-->
<style>
:root {
  color-scheme: dark;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --bg: #0e1013; --bg-2: #14171c; --bg-3: #1b1f26; --bg-4: #232832; --inset: #0a0c0f;
  --fg: #e7eaf0; --fg-dim: #b0b7c3; --fg-muted: #8a93a1;
  --border: #252a33; --border-strong: #353c48;
  --accent: #8fd3a6; --accent-dim: #8fd3a622; --on-accent: #0b1f13;
  --ok: #6fcf8e; --deny: #f06b78; --ask: #f2c14e; --info: #7aa7ff; --update: #f5913e;
  --ok-bg: #6fcf8e1f; --deny-bg: #f06b781f; --ask-bg: #f2c14e1f; --info-bg: #7aa7ff1f;
  --mock: #b48cff; --mock-bg: #b48cff22;
  --shadow: 0 18px 50px #000a; --scrim: #000b;
  --r: 10px; --control: 38px;
  --hue-banking: #5aa2ff; --hue-investing: #6fcf8e; --hue-retirement: #b48cff;
  --hue-crypto: #f2c14e; --hue-liability: #f06b78; --hue-other: #9aa3b2; --hue-linked: #4fc6d6; --hue-education: #ff9f5a; --hue-giving: #f27fb8;
  --c1: #7aa7ff; --c2: #8fd3a6; --c3: #b48cff; --c4: #f2c14e; --c5: #4fc6d6; --c6: #f28fb4; --c7: #f5913e; --c8: #9aa3b2;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f6f7f9; --bg-2: #ffffff; --bg-3: #f0f2f5; --bg-4: #e6e9ee; --inset: #ffffff;
  --fg: #161a20; --fg-dim: #444c58; --fg-muted: #626a77;
  --border: #e1e4ea; --border-strong: #cdd2da;
  --accent: #237a49; --accent-dim: #237a4918; --on-accent: #ffffff;
  --ok: #1f8a4c; --deny: #c43345; --ask: #8a5f00; --info: #2f5fd0; --update: #c25a00;
  --ok-bg: #1f8a4c14; --deny-bg: #c4334514; --ask-bg: #9a6a0014; --info-bg: #2f5fd014;
  --mock: #7a4fd0; --mock-bg: #7a4fd018;
  --shadow: 0 18px 50px #0003; --scrim: #0006;
  --hue-banking: #2f6fd0; --hue-investing: #1f8a4c; --hue-retirement: #7a4fd0;
  --hue-crypto: #9a6a00; --hue-liability: #c43345; --hue-other: #626a77; --hue-linked: #12808f; --hue-education: #b4560f; --hue-giving: #b02a6e;
  --c1: #2f6fd0; --c2: #1f8a4c; --c3: #7a4fd0; --c4: #b07800; --c5: #12808f; --c6: #b8336a; --c7: #c25a00; --c8: #626a77;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* The page is drawn at twice its size. Viewport units, media queries and pointer positions
   below are divided by --zoom (or the breakpoints multiplied by it) so the layout works in CSS pixels. */
html { --zoom: 2; zoom: 2; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--ok); } .down { color: var(--deny); } .dim { color: var(--fg-muted); } .small { font-size: 12px; }
body.privacy .amt { filter: blur(7px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* frame */
.app { display: grid; grid-template-columns: auto 1fr auto; height: calc(100vh / var(--zoom)); }
.side { width: 232px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: relative; transition: width .2s; }
.app.collapsed .side { width: 62px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--c1)); display: grid; place-items: center; color: var(--on-accent); font-weight: 800; flex: none; }
.brand-name { font-weight: 700; font-size: 16px; }
.brand-ver { font-size: 11px; color: var(--fg-muted); }
.pill-mock { background: var(--mock-bg); color: var(--mock); border: 1px solid var(--mock); border-radius: 99px; font-size: 10px; font-weight: 700; padding: 1px 7px; cursor: pointer; letter-spacing: .04em; }
.app.collapsed .brand-text, .app.collapsed .nav-label, .app.collapsed .user-text, .app.collapsed .nav-badge, .app.collapsed .nav-head { display: none; }
.collapse-btn { position: absolute; right: -12px; top: 22px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-3); display: grid; place-items: center; cursor: pointer; z-index: 2; }
.collapse-btn svg { width: 14px; height: 14px; }
.app.collapsed .collapse-btn svg { transform: rotate(180deg); }
nav { flex: 1; overflow-y: auto; padding: 6px 10px; }
.nav-head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); padding: 12px 8px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg-dim); cursor: pointer; white-space: nowrap; }
.nav-item:hover { background: var(--bg-3); color: var(--fg); text-decoration: none; }
.nav-item.active { background: var(--accent-dim); color: var(--accent); }
.nav-badge { margin-left: auto; background: var(--ask-bg); color: var(--ask); border-radius: 99px; font-size: 11px; padding: 0 7px; }
.user-tile { border-top: 1px solid var(--border); padding: 10px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; color: #0b0d10; }
.avatar.sm { width: 22px; height: 22px; font-size: 9px; }
.av-alice { background: #8fd3a6; } .av-bob { background: #7aa7ff; } .av-carol { background: #f2c14e; } .av-dave { background: #f28fb4; } .av-mom { background: #4fc6d6; }
.user-text { flex: 1; min-width: 0; cursor: pointer; }
.user-text b { display: block; font-size: 13px; }
.user-text span { font-size: 12px; color: var(--fg-muted); }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--fg-dim); }
.icon-btn:hover { background: var(--bg-3); color: var(--fg); }

main { overflow-y: auto; min-width: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 28px 0; }
.topbar h1 { font-size: 22px; margin: 0; font-weight: 650; flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.crumb { color: var(--fg-muted); font-weight: 400; }
.price-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot.stale { background: var(--ask); }
.content { padding: 18px 28px 60px; }
.help-corner { position: absolute; top: 0; right: 0; width: 44px; height: 44px; overflow: hidden; cursor: pointer; z-index: 3; }
.help-corner span { position: absolute; top: -22px; right: -22px; width: 44px; height: 44px; border-radius: 50%; background: var(--bg-4); color: var(--fg-muted); display: grid; place-items: start end; padding: 0; font-weight: 800; transition: .2s; }
.help-corner span::after { content: '?'; position: absolute; left: 9px; bottom: 7px; }
.help-corner:hover span { top: 4px; right: 4px; width: 36px; height: 36px; background: var(--ok); color: var(--on-accent); }
.help-corner:hover span::after { left: 13px; bottom: 7px; }

/* help pane */
.help { width: 360px; border-left: 1px solid var(--border); background: var(--bg-2); overflow-y: auto; padding: 18px 22px 40px; position: relative; display: none; }
.app.help-open .help { display: block; }
.app.help-open .help-corner { display: none; }
.help h1 { font-size: 18px; margin: 0 0 6px; }
.help h2 { font-size: 14px; margin: 18px 0 4px; padding: 4px 6px; margin-left: -6px; border-radius: 6px; transition: background .6s; }
.help h2.flash { background: var(--accent-dim); }
.help h2.active { font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
.help h2.active::before { content: ''; display: inline-block; width: .6em; height: .7em; margin-right: 7px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.help p, .help li { color: var(--fg-dim); font-size: 13px; }
.help code { font-family: var(--mono); font-size: 12px; background: var(--bg-3); padding: 1px 5px; border-radius: 4px; }
.help blockquote { margin: 10px 0; border-left: 3px solid var(--info); padding: 4px 12px; background: var(--info-bg); border-radius: 0 6px 6px 0; }
.help abbr.term { text-decoration: underline dashed var(--fg-muted) 1px; text-underline-offset: 3px; cursor: help; border-radius: 3px; }
.help abbr.term:hover, .help abbr.term:focus-visible { text-decoration-color: var(--accent); color: var(--fg); }
.help abbr.term.quiet { text-decoration-color: transparent; }
.help abbr.term.quiet:hover { text-decoration-color: var(--accent); }
.help h2.active abbr.term { text-decoration-line: none; }
.term-tip { position: fixed; z-index: 80; display: block; width: max-content; max-width: 300px; background: var(--bg-4); border: 1px solid var(--border-strong); border-top: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px 11px; font-size: 12px; font-weight: 400; box-shadow: var(--shadow); }
.term-tip[hidden] { display: none; }
.term-tip .term-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.term-tip .term-abbr { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--accent); background: var(--accent-dim); padding: 1px 6px; border-radius: 5px; white-space: nowrap; flex: none; }
.term-tip b { font-size: 13px; color: var(--fg); }
.term-tip .term-text { display: block; color: var(--fg-dim); line-height: 1.5; }
.term-tip .term-source { display: inline-flex; margin: -2px -4px -2px auto; padding: 3px; border-radius: 6px; color: var(--fg-muted); }
.term-tip .term-source:hover, .term-tip .term-source:focus-visible { color: var(--accent); background: var(--accent-dim); }
.term-tip .term-source svg.i { width: 15px; height: 15px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.help-close { position: absolute; top: 14px; right: 12px; }
.help .shot { border: 1px solid var(--border); border-radius: 8px; height: 90px; background: repeating-linear-gradient(45deg, var(--bg-3) 0 10px, var(--bg-2) 10px 20px); display: grid; place-items: center; color: var(--fg-muted); font-size: 12px; margin: 10px 0; }

/* components */
.card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .spacer { flex: 1; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.mt { margin-top: 16px; }
.kpi .label { font-size: 12px; color: var(--fg-muted); }
.kpi .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; }
.kpi .delta { font-size: 12px; }
.btn { height: var(--control); padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-3); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { background: var(--bg-4); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--deny); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.chips { max-width: 100%; overflow-x: auto; display: inline-flex; background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.chip { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; cursor: pointer; color: var(--fg-dim); font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--bg-2); color: var(--fg); box-shadow: 0 0 0 1px var(--border-strong); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 1px 8px; font-size: 11.5px; border: 1px solid var(--border-strong); color: var(--fg-dim); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--ask-bg); color: var(--ask); border-color: transparent; }
.pill.bad { background: var(--deny-bg); color: var(--deny); border-color: transparent; }
.pill.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.pill.new { background: var(--update); color: #1a0d00; border-color: transparent; font-weight: 600; cursor: pointer; }
.ocr { color: var(--info); }
.pager { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.jump { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.jump button { min-width: 30px; height: 28px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--bg-3); cursor: pointer; font-size: 12px; }
.jump button.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.ocr-text { font-family: var(--mono); font-size: 11.5px; white-space: pre; background: var(--inset); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; max-height: 160px; overflow: auto; color: var(--fg-dim); }
@keyframes pulse { 50% { opacity: .45; } }
.reading { animation: pulse 1.2s ease-in-out infinite; }
.pill.mockp { background: var(--mock-bg); color: var(--mock); border-color: transparent; }
.pill svg.i { width: 12px; height: 12px; }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--fg-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t th.num { text-align: right; }
.t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--bg-3); }
.t tfoot td { font-weight: 600; border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.tile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.tile svg.i { width: 18px; height: 18px; }
.t-banking { background: color-mix(in srgb, var(--hue-banking) 18%, transparent); color: var(--hue-banking); }
.t-investing { background: color-mix(in srgb, var(--hue-investing) 18%, transparent); color: var(--hue-investing); }
.t-retirement { background: color-mix(in srgb, var(--hue-retirement) 18%, transparent); color: var(--hue-retirement); }
.t-crypto { background: color-mix(in srgb, var(--hue-crypto) 18%, transparent); color: var(--hue-crypto); }
.t-liability { background: color-mix(in srgb, var(--hue-liability) 18%, transparent); color: var(--hue-liability); }
.t-other { background: color-mix(in srgb, var(--hue-other) 18%, transparent); color: var(--hue-other); }
.t-linked { background: color-mix(in srgb, var(--hue-linked) 18%, transparent); color: var(--hue-linked); }
.t-education { background: color-mix(in srgb, var(--hue-education) 18%, transparent); color: var(--hue-education); }
.t-giving { background: color-mix(in srgb, var(--hue-giving) 18%, transparent); color: var(--hue-giving); }
.status { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; white-space: nowrap; background: var(--bg-3); color: var(--fg-dim); }
.status.idea { background: var(--bg-3); } .status.planned { background: var(--info-bg); color: var(--info); }
.status.bought { background: var(--ask-bg); color: var(--ask); } .status.given { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.status.received { background: color-mix(in srgb, var(--hue-giving) 18%, transparent); color: var(--hue-giving); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kv > div { background: var(--bg-3); border-radius: 8px; padding: 10px 12px; }
.kv .k { font-size: 12px; color: var(--fg-muted); } .kv .v { font-size: 17px; font-weight: 650; margin-top: 2px; }
.acct-row { display: flex; align-items: center; gap: 12px; }
.acct-row .name { font-weight: 550; }
.acct-row .sub { font-size: 12px; color: var(--fg-muted); }
.group-head { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 6px; }
.group-head h2 { font-size: 15px; margin: 0; }
.group-head .num { margin-left: auto; font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab { padding: 9px 14px; border: 0; background: transparent; cursor: pointer; color: var(--fg-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.bar { height: 8px; border-radius: 99px; background: var(--bg-4); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.bar > i.warn { background: var(--ask); } .bar > i.over { background: var(--deny); }
.budget-row { display: grid; grid-template-columns: 170px 1fr 170px; gap: 12px; align-items: center; padding: 7px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--fg-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--fg-dim); font-weight: 500; }
.field .hint { font-size: 12px; color: var(--fg-muted); }
.field .err { font-size: 12px; color: var(--deny); }
input.in, select.in, textarea.in { height: var(--control); border-radius: 8px; border: 1px solid var(--border-strong); background: var(--inset); padding: 0 10px; width: 100%; }
textarea.in { height: auto; padding: 8px 10px; min-height: 64px; }
.pw { position: relative; display: block; }
.pw input.in { padding-right: 38px; }
.pw .icon-btn { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; }
input.in:focus, select.in:focus, textarea.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.in.bad { border-color: var(--deny); }
.row { display: flex; gap: 12px; } .row > * { flex: 1; min-width: 0; }
.switch { width: 36px; height: 20px; border-radius: 99px; background: var(--bg-4); position: relative; border: 1px solid var(--border-strong); cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg-muted); transition: .15s; }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { left: 18px; background: var(--on-accent); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--fg-dim); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--info-bg); color: var(--fg-dim); font-size: 13px; }
.notice.warn { background: var(--ask-bg); } .notice.bad { background: var(--deny-bg); }
.notice svg.i { margin-top: 1px; }
.locked-card { text-align: center; max-width: 480px; margin: 32px auto; display: grid; justify-items: center; gap: 6px; }
.locked-card h3 { margin: 4px 0 0; }
.locked-card p { margin: 0; }
.logo.hh { border: 0; cursor: pointer; background: linear-gradient(135deg, #8fd3a6, #7aa7ff); color: #10131a; font-size: 12px; border-radius: 50%; }
.app.peer .side { background: color-mix(in srgb, var(--peer) 13%, var(--bg-2)); border-right-color: color-mix(in srgb, var(--peer) 45%, var(--border)); }
.app.peer .nav-item.active { background: color-mix(in srgb, var(--peer) 24%, transparent); color: var(--fg); }

.qr { display: flex; justify-content: center; margin: 4px 0 8px; }

code.key { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; user-select: all; }
.small.center { text-align: center; }

'use strict';
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const icon = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const zoomOf = () => parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
const slug = (s) => String(s).toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function walk(n, end, vol, drift, seed) {
  const r = rng(seed), v = [1];
  for (let i = 1; i < n; i++) v.push(v[i - 1] * (1 + drift + (r() - 0.5) * vol));

const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
function money(n, o = {}) {

function signed(n, o = {}) { return `<span class="${n >= 0 ? 'up' : 'down'}">${money(n, { sign: true, ...o })}</span>`; }

  const list = `<div class="grid g2"><div class="card"><h3>Active<span class="spacer"></span><span class="small dim" style="font-weight:400">the plans being followed</span></h3>${actives.map((p) => `<div class="list-item ${p.id === x.id ? 'sel' : ''}" style="cursor:pointer" data-act="openproj" data-v="${p.id}"><div class="tile t-${PROJ_TILE[p.type]}">${icon(PROJ_ICON[p.type])}</div><div class="grow"><b>${p.name}</b> <span class="pill ${statusTone(p.status)}">${p.status}</span><div class="small dim">${projHead(p)} · on ${p.on}${p.sharedBy ? ` · shared by ${p.sharedBy}` : ''}</div></div>${p.sharedBy ? `<span class="small dim" style="white-space:nowrap">Show on my Dashboard</span>${sw(state.showShared).replace('data-act="switch"', 'data-act="showshared"')}` : trackSpark(p)}</div>`).join('')}</div>
    <div class="card"><h3>Scenarios<span class="spacer"></span><button class="btn sm" data-act="dlg" data-v="newProjection">${icon('plus')} New projection</button></h3>${scen.map((p) => `<div class="list-item ${p.id === x.id ? 'sel' : ''}" style="cursor:pointer" data-act="openproj" data-v="${p.id}"><div class="tile t-${PROJ_TILE[p.type]}">${icon(PROJ_ICON[p.type])}</div><div class="grow"><b>${p.name}</b><div class="small dim">${p.head} · ${p.subject}</div></div><button class="btn sm" data-act="dlg" data-v="makeActive" data-p="${p.id}">Make active</button></div>`).join('')}</div></div>`;
  const head = `<div class="toolbar mt"><div class="tile t-${PROJ_TILE[x.type]}">${icon(PROJ_ICON[x.type])}</div><b style="font-size:16px">${x.name}</b><span class="small dim">${x.type === 'savings' ? 'savings target' : x.type} · ${x.subject} · on ${x.on}</span>${x.active ? `<span class="pill ${statusTone(x.status)}">active · ${x.status}</span>` : '<span class="pill">scenario</span>'}<span class="spacer"></span>${x.sharedBy ? '' : `<button class="btn" data-act="dlg" data-v="share" data-name="${esc(x.name)}">${icon('share')} Share</button>`}${x.active && !x.sharedBy ? '<button class="btn" data-act="toast" data-v="Re-baselined: tracking now compares against today’s plan">Re-baseline</button><button class="btn" data-act="toast" data-v="It is a scenario again">Stop following</button>' : ''}${!x.active ? `<button class="btn primary" data-act="dlg" data-v="makeActive" data-p="${x.id}">Make active</button>` : ''}</div>`;
  const tracking = x.active && x.actual ? `<div class="card mt"><h3>Tracking since ${x.since}<span class="spacer"></span><span class="pill ${statusTone(x.status)}">${x.status}</span></h3>${lineChart({ labels: MONTHS.slice(-x.actual.length), series: [{ name: 'Actual', color: x.status === 'behind' ? 'var(--ask)' : 'var(--accent)', values: x.actual.map((v) => v * 1000), width: 2.5, tipfmt: (v) => '$' + nf0.format(v) }, { name: 'Baseline median', color: 'var(--fg-muted)', values: x.actual.map((_, i) => x.actual[0] * 1000 * (1 + i * 0.018)), dash: true, width: 1.5 }], bands: [{ lo: x.actual.map((_, i) => x.actual[0] * 1000 * (1 + i * 0.018) * 0.94), hi: x.actual.map((_, i) => x.actual[0] * 1000 * (1 + i * 0.018) * 1.06), color: 'var(--fg-muted)', opacity: 0.15 }], area: false, h: 200 })}<div class="legend mt"><span><i style="background:var(--accent)"></i>Actual balance</span><span><i style="background:var(--fg-muted)"></i>Baseline median, with its 10th–90th band</span></div><p class="small dim">The baseline was fixed when this projection was made active. Inside the band is on track, above it ahead, below it behind.</p></div>` : '';
  if (x.type === 'education') return `${list}${head}${tracking}<div class="card mt"><p style="margin:0">This projection is worked out on <b>Emma’s 529</b>’s Goal tab, where its inputs live. <a data-act="gogoal">Open the Goal tab</a></p></div>`;
  if (x.type === 'savings') {
    return `${list}${head}${tracking}<div class="grid g-main mt"><div class="card"><h3>Chance of reaching the target by the date</h3><div style="font-size:30px;font-weight:650">81%</div><p class="small dim">Saving $900 a month. $1,050 a month would reach it with a 90% chance. A model, not a forecast.</p></div>
      <div class="card"><h3>Inputs</h3>${field('Built on', sel(['High-Yield Savings ($38,200)', 'Choose accounts…', 'Typed amount…'], 'High-Yield Savings ($38,200)'))}<div class="row">${field('Target amount', inp('$60,000'))}${field('Target date', inp('2028-06-01', '', 'text'))}</div>${field('Contribution per month', inp('$900'))}<button class="btn primary" data-act="toast" data-v="Recomputed: 1,000 runs, seed 41">Run</button></div></div>`;
  }
  state.scenario = x.sc;
  const years = Array.from({ length: 41 }, (_, i) => String(2026 + i));
  const start = 478741, contrib = state.scenario === 2 ? 36000 : 30000, retire = x.age - 52;
  const p50 = [], p10 = [], p90 = [], p25 = [], p75 = [];
  let v = start;
  years.forEach((_, i) => {
    v = i === 0 ? v : v * 1.062 + (i <= retire ? contrib : -Math.max(80000, v * 0.04));
    const spread = Math.sqrt(i) * 0.11;
    p50.push(Math.max(0, v)); p10.push(Math.max(0, v * (1 - spread * 1.6))); p90.push(v * (1 + spread * 2.1)); p25.push(Math.max(0, v * (1 - spread * 0.8))); p75.push(v * (1 + spread * 0.95));
  });
  const success = parseInt(x.head, 10);
  return `${list}${head}${tracking}
  <div class="grid g-main mt">
    <div class="card"><h3>Projected value · Monte Carlo, 1,000 runs<span class="spacer"></span><div class="chips"><button class="chip on" data-act="seg">Nominal</button><button class="chip" data-act="seg">Today’s dollars</button></div></h3>
      ${lineChart({ labels: years, series: [{ name: 'Median', color: 'var(--accent)', values: p50, width: 2.5 }], bands: [{ lo: p10, hi: p90, color: 'var(--accent)', opacity: 0.12 }, { lo: p25, hi: p75, color: 'var(--accent)', opacity: 0.2 }], area: false, h: 280 })}
      <div class="legend mt"><span><i style="background:var(--accent)"></i>Median</span><span><i style="background:var(--accent);opacity:.4"></i>25th–75th percentile</span><span><i style="background:var(--accent);opacity:.18"></i>10th–90th percentile</span></div>
      <p class="small dim">A model, not a forecast. Returns from your assumptions in Profile (stocks 7%, bonds 4%, …), log-normal; contributions stop and withdrawals start at each retirement; inflation 2.5%; fees 0.10%. Seeded, so the same inputs give the same figures.</p></div>
    <div class="grid">
      <div class="card kpi"><div class="label">Chance the money lasts to 95</div><div class="value ${success > 90 ? 'up' : ''}">${success}%</div><div class="delta dim">median at retirement ${money(p50[Math.max(0, retire)], { cents: false })}</div></div>
      <div class="card"><h3>Inputs</h3>
        ${field('Built on', sel(['Portfolio: Retirement ($478,741)', 'Portfolio: All my accounts', 'Choose accounts…', 'Typed amount…'], 'Portfolio: Retirement ($478,741)'))}
        ${field('Who', sel(['Alice & Bob (couple)', 'Alice Griffin', 'Bob Griffin'], 'Alice & Bob (couple)'))}
        <div class="row">${field('Retirement age', inp(String(x.age)), 'Alice, born 1979')}${field('Partner retirement age', inp(String(x.age)), 'Bob, born 1977')}</div>
        <div class="row">${field('Contribution per year', inp('$' + nf0.format(contrib)))}${field('Grows yearly by', inp('3%'))}</div>
        ${field('Withdrawal', sel(['4% of balance', 'Fixed $80,000/yr, rising with inflation', 'Fixed % …'], '4% of balance'))}
        ${field('Other income', inp('Social Security: Alice from 67, $2,900/mo · Bob from 67, $2,400/mo'), 'Social Security and pensions, each from an age.')}
        <div class="row">${field('Expected return', inp('from Profile (6.2% blended)'))}${field('Volatility', inp('from Profile (14%)'))}</div>
        <button class="btn primary" data-act="toast" data-v="Recomputed: 1,000 runs, seed 41">Run</button></div></div></div>`;
};

DIALOGS.receipt = (d) => {
  const r = RECEIPTS.find((x) => x.name === d.name) || RECEIPTS.find((x) => x.suggested);
  const c = r.conf || {};
  const hint = (k) => (r.status === 'read' && c[k] ? fromReceipt(c[k]) : '');
  let side;
  if (r.status === 'reading') side = `<div class="notice reading">${icon('refresh')}<div>Reading this receipt on the server. The fields fill in when it’s done; you can type them now.</div></div>${field('Date', inp('', '', 'date'))}${field('Amount', inp(''))}${field('Payee', inp(''))}`;
  else if (r.status === 'failed') side = `<div class="notice bad">${icon('alert')}<div>${esc(r.reason)}</div></div>${field('Date', inp(r.d, '', 'date'))}${field('Amount', inp(''))}${field('Payee', inp(''))}<button class="btn sm" data-act="toast" data-v="Queued to read again">${icon('refresh')} Read again</button>`;
  else side = `${field('Date', inp(r.d, '', 'date'), hint('date'))}${field('Amount', inp(r.amt != null ? nf.format(r.amt) : ''), hint('total'))}${field('Payee', inp(r.payee), hint('merchant'))}${r.card ? `<div class="small dim" style="margin:-6px 0 12px">Card ending ${r.card}</div>` : ''}${field('Notes', inp(''))}${field('Tags', inp(r.link && r.link.includes('Medical') ? 'medical, 2026' : ''))}
    ${r.link ? `<div class="list-item"><span class="grow small dim">Linked to: ${esc(r.link)}</span>${r.detach ? '<button class="btn sm" data-act="toast" data-v="Detached when you save: it then waits in the inbox">Detach</button>' : ''}</div>${r.also ? `<p class="small dim">Also kept with ${r.also} ${r.also === 1 ? 'thing' : 'things'} not shared with you.</p>` : ''}` : r.match ? `<div class="notice">${icon('clip')}<div><b>Attach to</b> ${esc(r.match)}?<div class="toolbar" style="margin:8px 0 0"><button class="btn sm primary" data-act="toast" data-v="Attached when you save">Attach</button>${(r.alts || []).map((a) => `<button class="btn sm" data-act="toast" data-v="Attached when you save">${esc(a.split(' · ')[0])}</button>`).join('')}</div></div></div>` : ''}
    <div class="list-item mt"><span class="grow">${r.soon ? `<b>${r.kept}</b>` : (r.kept || 'Kept for ever')}<div class="small dim">${r.keepWhy || (r.link ? 'Its category keeps receipts for ever' : 'Attached to nothing, so kept')}</div></span><label class="small" style="display:inline-flex;gap:6px;align-items:center">Keep ${sw(false)}</label></div>
    <div class="toolbar mt"><span class="small dim">${r.method === 'OCR' ? 'Read with OCR' : 'Read from the PDF’s text layer'}</span><span class="spacer"></span><button class="btn sm" data-act="toast" data-v="Queued to read again">${icon('refresh')} Read again</button></div>`;
  return { title: r.name, wide: true, body: `<div class="split" style="align-items:flex-start"><div style="flex:1 1 300px"><div style="min-height:300px;background:var(--bg-3);border-radius:8px;display:grid;place-items:center"><div class="paper ${r.status === 'reading' ? 'reading' : ''}" style="width:180px;height:240px;gap:10px;padding:18px"><i></i><i style="width:60%"></i><i></i><i style="width:40%"></i><i></i><i style="width:75%"></i><i></i></div></div>
    ${r.text ? `<details class="mt"><summary class="small">Text read from the receipt (searchable)</summary><div class="ocr-text mt">${esc(r.text)}</div></details>` : ''}</div>
    <div style="flex:0 1 260px">${side}</div></div>`, ok: 'Save' };
};

  return { title: 'Bitcoin models', wide: true, body: `<p class="small dim" style="margin-top:0">Each model’s median path from today’s price ($98,000), on a log scale. These are models other people publish, shown so you can compare them, not MoolaKata’s view or advice.</p>

  <div class="table-wrap mt"><table class="t"><thead><tr><th>Model</th><th class="num">2030</th><th class="num">2035</th><th class="num">2045</th><th>Source and record</th></tr></thead><tbody>${BTC_MODELS.map((m) => `<tr><td>${m.name}</td>${[2030, 2035, 2045].map((y) => { const v = m.f(y); return `<td class="num">${v == null ? '<span class="dim">—</span>' : fmt(v)}</td>`; }).join('')}<td class="small dim">${m.note}</td></tr>`).join('')}</tbody></table></div>

let openDialog = null;
function showDialog(name, data = {}) {
  const d = DIALOGS[name](data);
  closeDialog();
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="dialog ${d.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(d.title)}"><header><h2>${esc(d.title)}</h2><button class="icon-btn" data-act="close" title="Close">${icon('x')}</button></header><div class="body">${d.body}</div><footer>${d.note ? `<span class="note">${d.note}</span>` : ''}<button class="btn" data-act="close">${d.cancel || (d.ok ? 'Cancel' : 'Close')}</button>${d.ok ? `<button class="btn primary" data-act="ok" data-v="${esc(d.ok)}">${esc(d.ok)}</button>` : ''}</footer></div>`;
  document.body.append(s); openDialog = s; maskContent();
  // A dialog holding changes (S12.15.6) isn't closed by a click on the dimmed content, and asks
  // before Escape, ✕ or Cancel close it.
  s.addEventListener('mousedown', (e) => { if (e.target === s && !s.dataset.changed) closeDialog(); });
  s.addEventListener('input', () => (s.dataset.changed = '1'));
  s.addEventListener('change', () => (s.dataset.changed = '1'));
  const f = s.querySelector(d.focusCancel ? 'footer button[data-act=close]' : 'input,select,textarea,button:not([data-act=close])'); if (f) f.focus();
  helpFor(name);
  if (d.after) d.after(s);
}
// Escape, ✕ or Cancel: closes, or asks first while the dialog holds changes.
function leaveDialog() {
  if (!openDialog) return;
  const p = openDialog.querySelector('.scrim.prompt');
  if (p) { p.remove(); return; }
  if (openDialog.dataset.changed) askDiscard(); else closeDialog();
}
function askDiscard() {
  const p = document.createElement('div');
  p.className = 'scrim prompt';
  p.innerHTML = `<div class="dialog prompt" role="alertdialog" aria-label="Discard your changes?"><header><h2>Discard your changes?</h2></header><div class="body"><p class="small dim" style="margin:0">What you changed in this dialog isn’t saved.</p></div><footer><button class="btn danger" data-act="discard">Discard</button><button class="btn primary" data-act="keep">Keep editing</button></footer></div>`;
  openDialog.append(p);
  p.querySelector('[data-act=keep]').focus();
}
// The question before a delete (S12.16), over the page or the dialog it comes from: No focused,
// Enter, Escape or a click outside answer No. data-v is "title|yes|toast".
function askConfirm(v) {
  const [title, yes, done, detail] = v.split('|');
  const p = document.createElement('div');
  p.className = 'scrim confirm';
  p.innerHTML = `<div class="dialog prompt" role="alertdialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2></header>${detail ? `<div class="body"><p class="small dim">${esc(detail)}</p></div>` : ''}<footer><button class="btn danger" data-act="confirmyes" data-v="${esc(done || '')}">${esc(yes || 'Yes, delete')}</button><button class="btn primary" data-act="confirmno">No</button></footer></div>`;
  document.body.append(p);
  p.addEventListener('mousedown', (e) => { if (e.target === p) p.remove(); });
  p.querySelector('[data-act=confirmno]').focus();
}
function closeDialog() { if (openDialog) { openDialog.remove(); openDialog = null; maskContent(); helpFor(null); } }
// A dialog masks the content, not the guide beside it: the sidebar and the page are inert, and the help pane
// stays in reach, so the dialog isn't aria-modal while it shows.
function maskContent() {
  document.querySelectorAll('.app > :not(.help)').forEach((el) => (el.inert = !!openDialog));
  if (!openDialog) return;
  const help = document.querySelector('.app.help-open > .help'), d = openDialog.querySelector('.dialog');
  openDialog.style.right = help ? help.offsetWidth + 'px' : '';
  if (help) d.removeAttribute('aria-modal'); else d.setAttribute('aria-modal', 'true');
}

  accounts: `<h1>Accounts</h1><p>Every account you own or that someone has shared with you, grouped by kind.</p><div class="shot">screenshot · accounts</div>
    <h2 id="h-filters">Filters</h2><p><b>Mine</b>, <b>Shared with me</b> (an eye for read, a pencil for write), and <b>Shared by me</b>.</p>
    <h2 id="h-import">Import</h2><p>OFX, QFX or CSV from your bank or broker. Re-importing the same file adds only what’s new.</p>
    <h2 id="h-new-account">New account</h2><p>Pick the type first. It decides the fields, the tax treatment, and how the account can be kept current.</p>
    <h2 id="h-share">Share</h2><p>The share button on a row opens the Share dialog for that account.</p>
    <h2>Linked households</h2><p>What another household shares with you opens in a window of its own, never mixed with your accounts or totals. Open one from here, or from your household’s avatar at the top of the sidebar.</p>`,
  account: `<h1>Account</h1><p>One account: its balance over time, what it holds, its transactions and positions, its receipts, and who it’s shared with.</p><div class="shot">screenshot · account</div>
    <h2 id="h-name">Name</h2><p>How the account appears everywhere. Only you see it as named; people you share it with see the same name.</p>
    <h2>Sync using MoolaKata Connector</h2><p>The connector fetches this account from its institution with one of your connections, and imports it as an upload would. Choose the connection and which of its institution accounts this is. Only the account’s owner turns it on.</p>
    <h2 id="h-connection">Connection</h2><p>One of your sign-ins kept by the connector, or <b>New connection…</b>.</p>
    <h2 id="h-institution-account">Institution account</h2><p>Which of that sign-in’s accounts this one is, by name and last four digits.</p>
    <h2>Statement values</h2><p>A brokerage statement’s ending value against what MoolaKata says the account was worth that day, cash and holdings at that day’s prices; within half a percent counts as a match.</p>
    <h2>Holdings check</h2><p>The positions of the latest brokerage statement or broker’s file against what MoolaKata holds that day: a quantity that differs is shown with the difference, a missed split or a reinvestment not entered yet. Positions never change the lots; a transaction does.</p>
    <h2 ${hid('Account')}>Account</h2><p>For a statement of several accounts, the account a part goes to: the one whose last four digits its header shows, or one you choose, or leave the part out.</p>
    <h2 id="h-statements-expected">Statements expected</h2><p>How often the institution issues statements or exports: monthly, quarterly, yearly or none. A statement is overdue, and alerted, once that has passed since the last one ended, plus a grace period: 15 days for monthly, 30 for quarterly, 60 for yearly. After three statements MoolaKata proposes the interval it sees them arrive at.</p>
    <h2 id="h-lot-method">Lot method</h2><p>Which lots a sale uses: <b>FIFO</b> (oldest first, the default), <b>LIFO</b>, <b>HIFO</b> (highest cost first, usually the smallest gain), <b>Specific identification</b> (you pick at each sale), or <b>Average cost</b> (mutual funds).</p>
    <h2 ${hid('Withdrawals allowed a month')}>Withdrawals allowed a month</h2><p>For a savings or money-market account: the bank’s limit on transfers out, empty for none. Budgets sum the moves back into one transfer and warn before going past it.</p>
    <h2 id="h-in-budgets">In budgets</h2><p>For a loan: how its payments count in budgets, at the bank account they come from. <b>Split by the schedule</b> puts interest, escrow, and PMI and fees each in its category and principal in a savings category, all under <i>Loan payments</i>, so a plan line on <i>Loan payments</i> counts the whole payment. <b>The whole payment</b> counts it all in one category.</p>
    <h2 ${hid('Keys, descriptor or addresses')}>Keys, descriptor or addresses</h2><p>An <code>xpub</code> (legacy, 1…), <code>ypub</code> (nested segwit, 3…) or <code>zpub</code> (native segwit, bc1q…); an <b>output descriptor</b> as Sparrow exports it, for taproot (<code>tr(…)</code>) or multisig (<code>wsh(sortedmulti(2, …))</code>); or addresses, one a line. MoolaKata derives a key’s receive and change addresses itself, and reads balances through the explorer or your own node set in Settings › Bitcoin.</p><blockquote>Never enter a seed phrase or private key. The form refuses anything that looks like one, and MoolaKata never stores it.</blockquote>
    <h2 ${hid('Gap limit')}>Gap limit</h2><p>How many unused addresses past the last used one are watched on each chain. 20 suits most wallets; raise it for one that skipped addresses. <b>Addresses</b> lists those watched.</p>
    <h2 id="h-method">Method</h2><p>How the account is kept current: OFX or QFX downloads, statements (a PDF or a photo, read on this server), CSV exports, or typed by hand; or by the MoolaKata Connector, once its sync is on.</p>
    <h2 id="h-keep-it-current-by">Keep it current by</h2><p>OFX or QFX downloads, statements, CSV exports, or typed by hand. You can change it later.</p>
    <h2>Reconcile</h2><p>Keeps the account in step with the institution. <b>Coverage</b> shows what your imports cover and flags gaps and overlaps. <b>Balance anchors</b> are balances the institution reported: a CSV’s balance column, an OFX file, a statement, or one you type. A mismatch shows the difference and what looks wrong in between.</p>
    <h2 id="h-balance">Balance</h2><p>Today’s balance as the institution shows it.</p>
    <h2 id="h-as-of">As of</h2><p>The day of that balance.</p>
    <h2 id="h-statement-closing-date">Statement closing date</h2><p>The last day the statement covers.</p>
    <h2 id="h-statement-closing-balance">Statement closing balance</h2><p>Its ending balance. Tick transactions as cleared until MoolaKata’s cleared balance equals it.</p>
    <h2>Several accounts in one statement</h2><p>A combined statement is split where each account’s part begins, and each part goes to the account whose last four digits its header shows. Choose the account when none matches, or leave the part out. Each part is checked against its own balances, one after another.</p>
    <h2>Brokerage statements</h2><p>A PDF from Schwab, Fidelity, Vanguard or a 401(k) plan is read for its summary, its positions and its cash. The ending value becomes a balance anchor; the positions are checked against what MoolaKata holds, and a difference is shown, such as a missed reinvestment. Cash lines already in the account start left out. Trades aren’t read: each opens the trade dialog with its figures.</p>
    <h2>Keep a statement</h2><p>Any statement can be kept on its account for the record, without its lines being read: a photo of a brokerage statement, one whose layout isn’t read, or one you only want archived. MoolaKata reads its period where it can.</p>
    <h2>Columns</h2><p>After the first release. For a statement with no section headings and no running balance, name its columns (Debit, Credit, Amount, Balance) and each line takes its sign from its column. The columns are remembered for that institution.</p>
    <h2>Matching a transfer</h2><p>Bitcoin moved between your own accounts, a wallet and an exchange or two wallets, is proposed as a match when the amounts agree less the network fee within 3 days. Confirmed, the coins keep their lots, basis and days held. A transaction is recorded after 6 confirmations; one that later leaves the chain is marked and you’re alerted, never deleted silently.</p>
    <h2>Import a statement</h2><p>A PDF statement or a photo of one. MoolaKata finds the period, the transactions and the balances, checks they add up, and shows them for you to check before saving.</p>
    <h2 id="h-period-from">Period from</h2><p>The statement’s first day, as read from it. The opening balance is the day before.</p><h2 id="h-period-to">Period to</h2><p>Its last day, the day of the closing balance.</p><h2 id="h-opening-balance">Opening balance</h2><p>As the statement shows it; a card’s balance owed shows as negative.</p><h2 id="h-closing-balance">Closing balance</h2><p>The transactions must add up from the opening balance to this one, or the difference is accepted.</p>
    <h2 id="h-into-account">Into account</h2><p>The account the statement or file belongs to.</p>
    <h2 id="h-active">Active</h2><p>Switch off when you close the account. It stays for history and taxes.</p>
    <h2>Loans</h2><p>A loan’s terms give its schedule. Payments from checking are split into principal, interest and escrow by it, and anything beyond the schedule is an overpayment.</p>
    <h2 ${hid('Original principal')}>Original principal</h2><p>What was borrowed, from the closing disclosure or the loan agreement.</p>
    <h2 ${hid('Term (months)')}>Term</h2><p>In months: 360 for a 30-year mortgage, 60 for a five-year car loan.</p>
    <h2 ${hid('Interest rate')}>Interest rate</h2><p>The note rate, not the APR, to three places as the note states it (6.875%). An adjustable rate’s resets, to four places, are typed when known.</p>
    <h2 ${hid('Interest method')}>Interest method</h2><p>Most mortgages amortize monthly. Most car loans charge simple interest daily, so paying early saves interest.</p>
    <h2 ${hid('Escrow per payment')}>Escrow per payment</h2><p>Property tax and insurance collected with the payment. Not principal; shown in Taxes.</p>
    <h2>Record a payment</h2><p>A payment on the loan, split into principal, interest, escrow, PMI and fees by the schedule. Bank transactions that look like the payment are offered to link instead.</p>
    <h2 ${hid('Paid on')}>Paid on</h2><p>The day the servicer received it.</p>
    <h2 ${hid('Amount')}>Amount</h2><p>What was paid, escrow included. Anything beyond the scheduled payment goes to principal as an overpayment.</p>
    <h2 ${hid('From account')}>From account</h2><p>The bank account it came from: its half of the transfer is recorded as well.</p>
    <h2 ${hid('Principal')}>Principal</h2><p>The parts as the schedule splits them; correct one from the servicer’s statement when it differs.</p>
    <h2 ${hid('Interest')}>Interest</h2><p>Interest for the period; deductible on a mortgage (Form 1098) or a student loan (1098-E).</p>
    <h2 ${hid('Escrow')}>Escrow</h2><p>Property tax and insurance, paid on by the servicer.</p>
    <h2 ${hid('PMI')}>PMI</h2><p>Mortgage insurance, until it can be dropped.</p>
    <h2 ${hid('Extra each month')}>Extra each month</h2><p>Principal paid with every payment beyond the schedule. The payoff planner shows the new payoff date and the interest saved.</p>
    <h2 ${hid('From')}>From</h2><p>The first payment the monthly extra goes with. Blank: the next one.</p>
    <h2 ${hid('Until')}>Until</h2><p>The last payment it goes with. Blank: until the loan is paid.</p>
    <h2 ${hid('Extra once a year')}>Extra once a year</h2><p>A bonus payment each December, such as from a year-end bonus.</p>
    <h2 ${hid('In')}>In</h2><p>The month the yearly extra goes with.</p>
    <h2 ${hid('Lump sum')}>Lump sum</h2><p>A one-time payment toward principal on a date.</p>
    <h2>Biweekly payments</h2><p>Half a payment every two weeks makes 26 half-payments, one extra payment a year.</p>
    <h2 ${hid('Round each payment up to')}>Round each payment up to</h2><p>Each payment, escrow included, rounded up to the next multiple of this; the difference goes to principal.</p>
    <h2>Recast after the lump sum</h2><p>The servicer re-amortizes the lower balance over the remaining term: a smaller payment instead of an earlier payoff, usually for a fee.</p>
    <h2 ${hid('Invest the extra in')}>Invest the extra in</h2><p>The asset class the comparison invests the same money in, at your expected return for it (Profile › Assumptions).</p>
    <h2 ${hid('Plan name')}>Plan name</h2><p>Saved plans are kept for the loan. Following one shows on the Overview whether you’re ahead of it or behind, from the day you chose it; the Payoff tab opens on it.</p>
    <h2>529 plans</h2><p>College savings for one beneficiary. Contributions are gifts to them, shown against the annual gift exclusion. Withdrawals are matched with qualified expenses and their receipts.</p>
    <h2 ${hid('Selling premium')}>Selling premium</h2><p>For metals at spot: what you’d expect over spot (or under it, negative) when selling. 0% by default.</p>
    <h2 ${hid('Condition or grade')}>Condition or grade</h2><p>Its condition, or its grade (MS-65, PCGS 64).</p>
    <h2 ${hid('Insurance policy')}>Insurance policy</h2><p>The policy that covers it, beside its insured value.</p>
    <h2 ${hid('Contribution date')}>Contribution date</h2><p>The day a contribution was deposited into the 529.</p>
    <h2 ${hid('Contribution amount')}>Contribution amount</h2><p>What was put in.</p>
    <h2 ${hid('Contributor')}>Contributor</h2><p>You, or a person on your list: a grandparent’s contribution is their gift to the beneficiary, counted against the annual gift exclusion.</p>
    <h2 ${hid('Paid from')}>Paid from</h2><p>The bank account it came from, to record both halves of the transfer.</p>
    <h2>Five-year election</h2><p>Superfunding: five years of exclusions given at once, counted a fifth a year, and elected on Form 709.</p>
    <h2 ${hid('Expense date')}>Expense date</h2><p>The day a qualified expense was paid; it counts in that tax year.</p>
    <h2 ${hid('Kind')}>Kind</h2><p>Which qualified expense: tuition and fees, room and board, books, a computer, K-12 tuition, an apprenticeship, or student-loan repayment.</p>
    <h2 ${hid('Expense amount')}>Expense amount</h2><p>What it cost.</p>
    <h2 ${hid('Description')}>Description</h2><p>What it was for, kept with its receipts.</p>
    <h2 ${hid('Beneficiary')}>Beneficiary</h2><p>A person from Gifts › People, or a user. The 529 counts in the owner’s net worth.</p>
    <h2 ${hid('Years of school')}>Years of school</h2><p>How many years the goal pays for.</p>
    <h2 ${hid('Cost per year (today’s dollars)')}>Cost per year</h2><p>In today’s dollars; education inflation raises it each year. The shipped averages are a starting point.</p>
    <h2 ${hid('Education inflation')}>Education inflation</h2><p>How fast costs rise each year. 5% by default.</p>
    <h2 ${hid('Monthly contribution')}>Monthly contribution</h2><p>What you plan to add each month until school starts.</p>
    <h2>Physical assets</h2><p>Metals, collectables, property and vehicles, held as items with their own purchase date, cost basis, notes, photos and documents.</p>
    <h2 ${hid('Weight per unit')}>Weight per unit</h2><p>In troy ounces (ozt), grams or kilograms. With the purity and quantity it gives the fine weight valued at spot.</p>
    <h2 ${hid('Purity')}>Purity</h2><p>Such as .9999, .999, .925 or 22k. A 22k Gold Eagle weighs 1.0909 ozt and holds 1 oz of gold.</p>
    <h2 ${hid('Cost basis')}>Cost basis</h2><p>What you paid, plus premium, fees and shipping. A gift carries over the giver’s basis; an inherited item takes its value at death.</p>
    <h2 ${hid('How acquired')}>How acquired</h2><p>Bought, received as a gift, or inherited. It decides the basis.</p>
    <h2 ${hid('Value')}>Valuations</h2><p>Dated values with their source. The latest counts, and one over a year old is marked stale.</p>
    <h2 id="h-institution">Institution</h2><p>The bank, broker or other firm that holds the account.</p>
    <h2 id="h-last-4">Last 4</h2><p>The last four digits of the account number, to tell accounts apart. Never the full number.</p>
    <h2 id="h-import-mapping">Import mapping</h2><p>How this institution’s CSV columns map to MoolaKata’s fields. Saved per institution.</p>
    <h2 id="h-lump-sum-date">Lump sum date</h2><p>When the one-time extra payment is made.</p>
    <h2 id="h-first-year-of-school">First year of school</h2><p>From the beneficiary’s birth year; change it for an early or late start.</p>
    <h2 id="h-category">Category</h2><p>What kind of item it is: a coin, a bar, a card, a painting.</p>
    <h2 id="h-date-acquired">Date acquired</h2><p>When you bought or received it. It starts the holding period for tax.</p>
    <h2 id="h-insured-value">Insured value</h2><p>What the item is insured for, for your records.</p>
    <h2 id="h-where-it-s-kept">Where it’s kept</h2><p>A safe, a bank box, a room. Only you see it.</p>
    <h2 id="h-serial-or-certificate">Serial or certificate</h2><p>A serial number, grading certificate or registration.</p>
    <h2 id="h-notes">Notes</h2><p>Anything else worth keeping with it.</p>`,
  gifts: `<h1>Gifts</h1><p>The people in your life, their birthdays, anniversaries and holidays, and the gifts you plan, buy and give. People are the household’s; your gift plans and gifts are yours alone unless you share a plan.</p>
    <h2>Upcoming</h2><p>The next 60 days of occasions, with the budget and what’s planned. Those inside their reminder time also show on the Dashboard.</p>
    <h2>The person</h2><p>Name, sex and birthday belong to the person, seen by the whole household unless its creator keeps it private. Once they sign in here, only they and an admin change them; until then, its creator or an admin. How they’re related to you is worked out from relationships. Gifts for someone who uses this server are never shown to them, even through a share.</p>
    <h2>Join them</h2><p>A user of a linked server is a person of their own here. When one has this person’s name, the plan offers <b>Join them</b>: joined, that user is this person, which stays as private as it was.</p>
    <h2 ${hid('Name')}>Name</h2><p>One person, once: a name already here shows that person instead.</p>
    <h2 ${hid('Sex')}>Sex</h2><p>Chooses the words for the family tree: mother or father, niece or nephew.</p>
    <h2 ${hid('Birthday')}>Birthday</h2><p>The year is optional; with it, the age shows.</p>
    <h2 ${hid('Died on')}>Died on</h2><p>The day they died. It ends a marriage on that day; their gifts stay in your history.</p>
    <h2 ${hid('Private')}>Private</h2><p>Seen only by you and whoever you share them with. Only whoever added them makes them private.</p>
    <h2>Delete plan, delete person</h2><p>Delete plan removes your gift plan; the person stays. Delete person removes them for everyone, asking first: gifts bought, given or received stay in the history as <i>Emma (deleted)</i>.</p>
    <h2 ${hid('Birth year')}>Birth year</h2><p>Tells two people with the same name apart.</p>
    <h2 ${hid('Anniversary')}>Anniversary</h2><p>Any anniversary other than a wedding, each with its own date. A wedding anniversary comes from the marriage.</p>
    <h2>A deleted person</h2><p>Gifts bought, given or received stay in the history and spending, marked <i>(deleted)</i>. Ideas and planned gifts for them alone go with them.</p>
    <h2>Holidays</h2><p>Which holidays they get gifts for. Dates are worked out each year, including lunar ones such as Diwali and Lunar New Year.</p>
    <h2 ${hid('Yearly gift budget')}>Yearly gift budget</h2><p>For all their occasions in a year, or set one per occasion.</p>
    <h2 ${hid('Remind me')}>Remind me</h2><p>How far ahead an occasion reaches the Dashboard.</p>
    <h2 ${hid('Occasion')}>Occasion</h2><p>What the gift is for. <i>No date</i> keeps it as an idea.</p>
    <h2>Status</h2><p><b>Idea</b>, <b>planned</b>, <b>bought</b>, <b>given</b>, or <b>received</b> for a gift to you, with a thank-you tick.</p>
    <h2 ${hid('Paid with')}>Paid with</h2><p>Link the transaction, so the cost is exact, or type it. One purchase can be split across several gifts.</p>
    <blockquote>Cash and 529 gifts to one person over the annual exclusion are flagged in Taxes for Form 709.</blockquote>
    <h2 id="h-name">Name</h2><p>The person’s name, as you know them.</p>
    <h2 id="h-notes">Notes</h2><p>Sizes, likes, what they already have.</p>
    <h2 id="h-for">For</h2><p>Who the gift is for.</p>
    <h2 id="h-description">Description</h2><p>What it is.</p>
    <h2 id="h-cost">Cost</h2><p>What it cost, or will. Linked to its transaction when bought.</p>
    <h2 id="h-where-bought">Where bought</h2><p>A shop or a link.</p><h2>Given in money</h2><p>A gift of cash or a cheque. Money given to one person in a year, with your 529 contributions for them, above the annual gift exclusion is flagged for Form 709.</p>`,
  giving: `<h1>Giving</h1><p>Charitable donations against a target you set as a percentage of income, by organisation, cause and type, with the acknowledgements the tax rules need.</p>
    <h2 ${hid('Percent of income')}>Percent of income</h2><p>The target as a share of the income basis below. 10% when you first set one.</p>
    <h2 ${hid('Income basis')}>Income basis</h2><p><b>Gross income</b> as typed from a W-2, <b>income transactions</b> (take-home pay), or an <b>AGI estimate</b>.</p>
    <h2 ${hid('Count the DAF')}>Count the DAF</h2><p>A donor-advised fund counts once: when you fund it (the default) or when it grants.</p>
    <h2 ${hid('Organisation')}>Organisation</h2><p>Whether gifts to it are deductible: a 501(c)(3) is; a campaign or a person isn’t.</p>
    <h2 ${hid('Type')}>Type</h2><p>Cash, goods at fair value, appreciated shares (from a lot: no gain realized), a QCD from an IRA, or a DAF contribution or grant.</p>
    <h2 ${hid('From lot')}>From lot</h2><p>Shares held over a year are deducted at market value, others at the lesser of their value and their basis.</p>
    <h2 ${hid('Acknowledgement')}>Acknowledgement</h2><p>A written acknowledgement is needed for any single gift of $250 or more. Attach it as a receipt.</p>
    <h2 id="h-date">Date</h2><p>The day of the gift.</p>
    <h2 id="h-shares">Shares</h2><p>How many shares are given from the lot.</p>
    <h2 id="h-amount">Amount</h2><p>For shares, their market value that day; otherwise what was given.</p>
    <h2 id="h-gross-income">Gross income</h2><p>From your W-2 or pay stubs, for a target set as a percentage.</p>
    <h2 id="h-shared-with">Shared with</h2><p>Who can see or edit the plan.</p><h2 ${hid('Organisation name')}>Organisation name</h2><p>What it’s called.</p><h2 ${hid('EIN')}>EIN</h2><p>Its employer identification number, from its receipts or the IRS’s list of charities.</p><h2>Deductible</h2><p>Gifts to a 501(c)(3) charity are deductible; to a political campaign or a person they aren’t.</p><h2 ${hid('Causes')}>Causes</h2><p>Tags for giving by cause.</p><h2 ${hid('Pledge')}>Pledge</h2><p>An amount promised, shown as expected donations until the year’s end.</p><h2 ${hid('Every')}>Every</h2><p>A month or a year.</p>`,
  corporateAction: `<h1>Record a corporate action</h1><p>What a company did to the shares you hold: their lots are reshaped or moved to the new shares with the days they were held, never sold and bought again. Delete either side of one on its transactions and both go.</p>
    <h2 ${hid('Holding')}>Holding</h2><p>The shares it happened to, in one account.</p>
    <h2 ${hid('Action')}>Action</h2><p><b>Split or reverse split</b>: more or fewer shares, the same basis. <b>Symbol change</b>: the same shares under a new symbol. <b>Spin-off</b>: new shares of another company, with part of the basis. <b>Merger</b>: the acquirer’s shares, cash, or both, in place of yours.</p>
    <h2 ${hid('Date')}>Date</h2><p>The day it took effect.</p>
    <h2 ${hid('New symbol')}>New symbol</h2><p>The new company’s or the new name’s symbol. A merger paid all in cash has none: it is a sale.</p>
    <h2 ${hid('New shares for each held')}>New shares for each held</h2><p>How many new shares each one you held became: 2 for a 2-for-1 split, 0.1 for a 1-for-10 reverse, 0.3333 for one new share for every three.</p>
    <h2 ${hid('Basis to the new shares')}>Basis to the new shares</h2><p>For a spin-off, the share of your basis that moves to the new company, in percent, as the company’s Form 8937 states it; the rest stays with the shares you held.</p>
    <h2 ${hid('Cash for each share held')}>Cash for each share held</h2><p>What a merger paid in cash for each share, besides any shares. Cash in lieu of a fractional share is a sale of its own.</p>
    <h2 ${hid("A new share's price that day")}>A new share’s price that day</h2><p>With cash and shares, the cash is a gain only as far as the gain goes (IRC §356), and the acquirer’s price that day tells the gain.</p>`,
  editTx: `<h1>Edit transaction</h1><p>A transaction as you see it; the bank’s own text stays beside what you change.</p>
    <h2 ${hid('Date')}>Date</h2><p>The day it posted, as the bank wrote it.</p>
    <h2 ${hid('Amount')}>Amount</h2><p>Money in is positive, money out negative.</p>
    <h2 ${hid('Payee')}>Payee</h2><p>Who it was paid to or came from, as you want it shown. The bank’s text is kept, and your rules match on it.</p>
    <h2 ${hid('Category')}>Category</h2><p>Where the money went, for budgets and taxes. <b>Make a rule</b> files this payee the same way from now on, from what you import.</p>
    <h2 ${hid('Memo')}>Memo</h2><p>A note of your own.</p>
    <h2 id="h-reimbursable">Reimbursable</h2><p>Spending someone pays back: an employer’s expense, a roommate’s half. It keeps its category, and budgets don’t count it while it’s awaited. It is listed under <b>Awaiting reimbursement</b> on Budgets, where a deposit that may pay it back is offered to pair; the paired part of the deposit isn’t income.</p>
    <h2 ${hid('Reimbursable amount')}>Reimbursable amount</h2><p>All of it unless you say less. Lower it to what was paid back, or turn the mark off, and the rest counts as spending again, in the month it was spent.</p>
    <h2 ${hid('Owed by')}>Owed by</h2><p>Who pays it back, as you want to see it: <i>Acme Corp</i>, <i>Sam</i>.</p>
    <h2 id="h-in-budgets">In budgets</h2><p>Each budget that counts this transaction and what it counts as there. <b>Leave out</b> is that budget’s own, for a one-off such as a car bought outright: it counts nowhere in that budget, and Activity records it.</p>
    <h2 id="h-saving">Saving</h2><p>Nothing is saved until <b>Save</b>, and then all of it or none. If the save needs to ask something first, every question is listed together, and going ahead confirms just those. If the transaction changed since you opened it, nothing is saved, and <b>Reload</b> opens it as it stands. Closing the dialog with changes asks before discarding them.</p>`,
  csvMapping: `<h1>Which columns are which?</h1><p>The first CSV from an institution: the columns MoolaKata guessed, for you to check. What you choose is kept for the next file from it. Notes the file writes below its rows, after a blank line, are left out.</p>
    <h2 id="h-date-column">Date column</h2><p>The column with each row’s date.</p>
    <h2 id="h-description-column">Description column</h2><p>The payee, merchant or description.</p>
    <h2 id="h-amount-column">Amount column</h2><p>One column with money in as + and money out as −.</p>
    <h2 id="h-debit-column">Debit column</h2><p>When money out has its own column instead.</p>
    <h2 id="h-credit-column">Credit column</h2><p>When money in has its own column.</p>
    <h2 id="h-running-balance-column">Running balance column</h2><p>Optional. Every row’s balance is then checked against MoolaKata’s.</p>
    <h2 id="h-memo-column">Memo column</h2><p>Optional.</p>
    <h2 id="h-transaction-id-column">Transaction id column</h2><p>Optional: the institution’s own id for each row, which makes re-imports exact.</p>
    <h2 id="h-action-column">Action column</h2><p>For an investing or crypto account’s trade history: what each row is, a buy, a sale, a dividend, a transfer. A buy’s cash goes out and a sale’s comes in, whatever sign the file writes.</p>
    <h2 id="h-symbol-column">Symbol column</h2><p>The ticker, fund symbol or coin each row trades. A five-letter symbol ending in X is taken for a mutual fund, any other ticker for a listed share; in an exchange’s file, a coin.</p>
    <h2 id="h-quantity-column">Quantity column</h2><p>How many shares or coins.</p>
    <h2 id="h-price-column">Price column</h2><p>Optional: the price per share or coin.</p>
    <h2 id="h-fees-column">Fees column</h2><p>Optional: commission, fees or spread.</p>
    <h2 id="h-date-format">Date format</h2><p>How the file writes dates: <code>%m/%d/%Y</code> for 10/12/2026, <code>%Y-%m-%d</code> for 2026-10-12.</p>
    <h2 id="h-spending-is-positive">Spending is positive</h2><p>Card exports often show purchases as positive amounts: this flips them.</p>`,
  rules: `<h1>Categorisation rules</h1><p>Your rules for the transactions you import: each says what a payee looks like and what to set when one matches. They are yours alone, never shared, and never sent to a linked server.</p>
    <h2 id="h-first-match">First match wins</h2><p>A transaction takes the first rule, top to bottom, that it matches, so a narrow rule goes above a broad one: <code>re:^KROGER FUEL</code> above <code>kroger</code>. Move a rule with <b>↑</b> and <b>↓</b>.</p><p>Rules set a category only where there is none, and never touch a split, a transfer between your accounts or a trade. They run on every file, statement and connector fetch you import, and on the receipts you add: a rule that renames a payee renames the merchant a receipt names.</p><p><b>Apply to the uncategorised</b> runs them now over the uncategorised transactions in the accounts you can change. Activity records how many it set, never an amount.</p>`,
  rule: `<h1>A rule</h1><p>What a transaction must match, and what the rule sets. It needs at least one of a category, a new payee or a tag.</p>
    <h2 ${hid('Payee contains')}>Payee contains</h2><p>Text the payee holds as the bank writes it, case aside: <code>whole foods</code> matches <code>WHOLE FOODS #123</code>. Start with <code>re:</code> for a regular expression: <code>re:^AMZN</code> matches a payee that starts with AMZN. A repeat inside a repeated group, such as <code>(a+)+</code>, is refused: on a payee that nearly matches it could run for ever.</p>
    <h2 ${hid('Amount from')}>Amount from</h2><p>The smallest amount it matches, without its sign: 20 matches −$20.00 and $20.00. Leave it empty for any.</p>
    <h2 ${hid('Amount to')}>Amount to</h2><p>The largest amount it matches. With <b>Amount from</b>, a range: 0 to 20 for small purchases.</p>
    <h2 ${hid('Direction')}>Direction</h2><p>Money in, money out, or either: a payroll deposit is money in, a refund from a shop too.</p>
    <h2 ${hid('Account')}>Account</h2><p>One account, or any of those you can change.</p>
    <h2 ${hid('Category')}>Category</h2><p>What a matching transaction is filed under, when it has no category yet. <b>Leave it as it is</b> for a rule that only renames or tags.</p>
    <h2 ${hid('Rename to')}>Rename to</h2><p>The payee shown in your lists: <code>Amazon</code> for <code>AMZN Mktp US*2K4LL</code>. The bank’s text stays beside it, and the rules match on the bank’s text.</p>
    <h2 ${hid('Tags')}>Tags</h2><p>Your own tags, added to each match: <code>coffee, work</code>.</p>`,
  transactions: `<h1>Transactions</h1><p>Every transaction across your accounts, to search, sort into categories, and attach receipts to.</p><div class="shot">screenshot · transactions</div>
    <h2 id="h-search">Search</h2><p>Matches payee, memo and amount (<code>142.18</code> or <code>&gt;100</code>).</p>
    <h2 id="h-rules">Rules</h2><p>Your categorisation rules: what a payee looks like, and the category, payee and tags to set. They run on what you import, and on the uncategorised when you choose. A transaction’s own dialog offers <b>Make a rule</b> from it.</p><p>Example: <code>re:^AMZN</code> → <i>Personal › Subscriptions</i>, renamed <i>Amazon</i>.</p>
    <h2 id="h-import">Import</h2><p>OFX, QFX or CSV. Rows already present are skipped.</p>
    <h2 id="h-into-account">Into account</h2><p>The account the file belongs to.</p>
    <h2 id="h-format">Format</h2><p>OFX or QFX, a saved CSV mapping for this institution, or a new CSV mapping.</p>`,
  portfolios: `<h1>Portfolios</h1><p>Named groups of accounts, charted as one: value against a benchmark, returns, and holdings.</p><div class="shot">screenshot · portfolio</div>
    <h2 id="h-time-weighted-return">Time-weighted return</h2><p>How the investments did, ignoring when you added or took out money. Use it to compare with a benchmark.</p>
    <h2 id="h-money-weighted">Money-weighted (IRR)</h2><p>How <i>your</i> money did, counting when you added it.</p>`,
  positions: `<h1>Positions</h1><p>What you hold, from open to closed, with gains and losses. Options included.</p><div class="shot">screenshot · positions</div>
    <h2>Strategies</h2><p>Legs held together, such as a covered call or an iron condor, shown as one with their credit (or cost, negative), P/L, max profit and loss and breakevens at expiry. Legs opened together on one underlying are offered as a strategy, and you can group legs by hand or undo a group. A leg closed and another opened the same day can stay in the group as a roll. Grouping is a label: lots, gains and wash sales stay per leg.</p>
    <h2 id="h-at-risk-now">At risk now</h2><p>The capital at risk: what the strategy can still lose at today’s prices: a spread’s widest wing less its credit, a cash-secured put’s strike less its premium, a covered call’s shares less the premium. <i>Unlimited</i> for a naked call, unless you type the broker’s margin requirement; then the total is unlimited too.</p>
    <h2 id="h-at-open">At open</h2><p>The same, for the legs it opened with at the prices of that day, whatever was rolled or closed since, with the return worked on it below.</p>
    <h2>Adjusted contracts</h2><p>After a split that isn’t a whole number, a merger, a spin-off or a large special dividend, the OCC gives open options a new root (XYZ1) and a new deliverable. Type them from its memo; the lots carry over.</p>
    <h2 id="h-new-root">New root</h2><p>The adjusted contract’s symbol root, such as <i>XYZ1</i>.</p><h2 id="h-strike">Strike</h2><p>Usually unchanged by the adjustment.</p><h2 id="h-deliverable">Deliverable</h2><p>What one contract delivers: 150 XYZ, or 100 XYZ and 25 ABC.</p><h2 id="h-cash">Cash</h2><p>Any cash one contract delivers too.</p>
    <h2 id="h-record-trade">Record trade</h2><p>Stocks, options and crypto. For options: <b>Sell to open</b> writes a contract (credit), <b>Buy to close</b> ends it.</p>
    <h2 id="h-underlying">Underlying</h2><p>The stock or ETF the option is on.</p><h2 id="h-strike">Strike</h2><p>The contract’s price per share.</p><h2 id="h-action">Action</h2><p><b>Expired</b>, <b>Assigned</b> and <b>Exercised</b> close the option. Assignment and exercise create stock lots at the strike, with the premium folded into their basis.</p>
    <h2 id="h-contracts">Contracts</h2><p>Each is 100 shares unless the contract says otherwise.</p><h2 id="h-price-per-share">Price per share</h2><p>The premium as quoted: 4.12 means $412 per contract.</p><h2 id="h-fees">Fees</h2><p>Commission and regulatory fees; part of the cost or proceeds.</p>
    <h2 id="h-wash-sale">Wash sale</h2><p>A loss sale with a purchase of the same security within 30 days either side. The loss is disallowed now and added to the new lot’s basis.</p>
    <h2 id="h-account">Account</h2><p>The account the trade was made in.</p>
    <h2 id="h-expiry">Expiry</h2><p>The option’s expiration date.</p>
    <h2 id="h-right">Right</h2><p>Call or put.</p>
    <h2 id="h-trade-date">Trade date</h2><p>The day the trade was made.</p><h2>Expiry, assignment and exercise</h2><p>An option that expires out of the money is closed the day after; one in the money asks what happened.</p><h2 ${hid('Settled on')}>Settled on</h2><p>The day it expired, or was assigned or exercised.</p><h2 ${hid('Contracts settled')}>Contracts settled</h2><p>How many of the contracts.</p>
    <h2>Option marks</h2><p>An option is valued at the price source’s daily close; without one, at a mark you type (<b>Mark…</b>); without that, at its intrinsic value. The market value says which.</p><h2 ${hid('Marked on')}>Marked on</h2><p>The day the mark is for.</p><h2 ${hid('Mark')}>Mark</h2><p>A share, as quoted: 0.22 for a contract worth $22.</p>
    <h2>Option trades</h2><p>Each option trade from its first contract opened to its last closed: the premium in and out, fees included, and the P/L. One still open shows the P/L if closed now.</p><h2 ${hid('Capital at risk')}>Capital at risk</h2><p>A long option risks its premium; a short one the strike on every share its contracts cover. The return is the P/L over it.</p>
    <h2 ${hid('Name')}>Name</h2><p>A strategy’s own name; empty, its shape names it.</p>
    <h2 ${hid('Underlying')}>Underlying</h2><p>The stock whose options the OCC adjusted.</p>
    <h2 ${hid('Effective')}>Effective</h2><p>The day the adjustment took effect.</p>
    <h2 ${hid('Margin requirement')}>Margin requirement</h2><p>Your broker’s, for a strategy whose loss has no limit (a naked call, a short straddle or strangle): it is then its capital at risk.</p>
    <h2>Grouping legs</h2><p>Tick legs on the Open tab, in one account and on one underlying, and group them. Ungrouping leaves each leg as it is.</p>`,
  budgets: `<h1>Budgets</h1><p>Plan the month by category and see where the money actually went.</p><div class="shot">screenshot · budgets</div>
    <h2 id="h-budgets">Active and scenarios</h2><p>You follow one <b>active</b> budget: the Dashboard, budget alerts and what to move come from it. The others are <b>scenarios</b>, to try another method or plan beside it; <b>Make active</b> swaps them and rewrites nothing. <b>Copy as scenario</b> starts one from the same accounts and plan.</p>
    <h2 id="h-categories">Categories</h2><p>Green until 90%, amber to 100%, red over. An overspent row offers <b>Cover from…</b>, a move from a category with money left. A household budget shared with a group at <b>write</b> lets everyone in it edit. <b>Refresh</b> works the month out again at once.</p>
    <h2 id="h-reserves">Reserves</h2><p>Money set aside month by month toward a <b>target</b>, for a cost that comes now and then: car repairs, a roof. Each month puts in its amount until the target is reached, then it reads <b>Funded</b> and puts in nothing until spending draws it down. A repair shows as a withdrawal, not as overspending.</p>
    <h2 id="h-left-or-entered">Left or entered the budget</h2><p>A transfer to or from an account the budget doesn’t count counts by its category: to a brokerage account as savings, to a cash account as <b>Cash</b>. One with no category waits here, counting nowhere, until you sort it.</p>
    <h2 id="h-moves">Moves</h2><p>An amount put from one category to another for one month, shown on both rows and in Activity. Delete it to undo. In an envelope budget a move can also come from <b>To Budget</b>.</p>
    <h2 id="h-where-the-money-is">Where the money is</h2><p>For each account reserves are held in: the reserves, what they gained, and what was moved into the account from the budget’s other accounts. When the reserves are ahead, the difference is <b>to move</b> there from the day-to-day account; after a repair, back. Money of the account’s own (interest, other savings) doesn’t count. MoolaKata moves no money: make the transfer at the bank, and once it is imported and paired the account reads <b>backed</b>.</p>
    <h2 id="h-review">Review</h2><p>Last month’s loose ends, each with its action: overspending, what to move, uncategorised transactions and transfers to sort. <b>Mark reviewed</b> records it; a reviewed month that changes later is flagged until you review it again. Months are never locked.</p>
    <h2 id="h-compare">Compare</h2><p>The active budget beside a scenario, per category, for a month or the year so far.</p>
    <h2 id="h-cash-flow">Cash flow</h2><p>Income on the left, where it went on the right. Transfers between your own accounts aren’t spending.</p>
    <h2 id="h-recurring">Recurring</h2><p>Detected from history: three or more payments at a steady interval. A late one is flagged <b>missed</b>; a fixed amount that moved, <b>higher</b> or <b>lower</b>.</p>
    <h2 id="h-awaiting">Awaiting reimbursement</h2><p>Spending marked reimbursable and not yet paid back, with its age. A deposit that may pay one back is offered to pair.</p>
    <h2 id="h-name">Name</h2><p>Such as <i>Household</i>.</p>
    <h2 ${hid('Method')}>Method</h2><p><b>Tracking</b>: a plan per category against what is spent, received and saved. <b>Envelope</b>: the money in the budget’s accounts is handed out to categories until <b>To Budget</b> is zero, and card spending is set aside for the card’s payment. A budget keeps its method; copy it as a scenario to try the other.</p>
    <h2 id="h-accounts-roles">Where money comes from</h2><p>Nothing to set: each card’s <b>paid from</b> account is learned from its payments, so a card each for two spouses, paid from different accounts, just works. Each checking account with recurring payments is watched, and an alert warns when one would dip below zero before money comes in.</p>
    <h2 ${hid('Estimate from history')}>Estimate from history</h2><p>Proposes a plan line per category from its average over the months you pick, and the recurring payments as lines of their own. Keep, change or drop each before saving.</p>
    <h2 id="h-amount">Amount</h2><p>What you mean to spend in a month, or a year for a yearly line. The plan applies from the month shown; earlier months keep theirs.</p>
    <h2 id="h-every">Every</h2><p><b>Month</b>, or <b>Year</b> for costs that come once or twice a year, compared with the year so far.</p>
    <h2 id="h-rollover">Rollover</h2><p>Carry what is left at the end of a month into the next, or what was overspent out of it. A reserve always rolls over.</p>
