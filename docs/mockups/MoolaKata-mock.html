    <h2 id="h-target">Target</h2><p>Makes the line a reserve: it saves toward this amount. Taking it off asks first, since the balance stops being kept.</p>
    <h2 id="h-held-in">Held in</h2><p>The account a reserve’s money is kept in, for <b>Where the money is</b>.</p>
    <h2 ${hid('From')}>From</h2><p>A category or a reserve with money left this month (an emergency fund covering a hospital bill), or <b>To Budget</b> in an envelope budget.</p>
    <h2 ${hid('Moved from')}>Moved from</h2><p>Where <b>to move</b> suggests moving from, proposed from the account that sends this one the most. Only a suggestion: a transfer from any of the budget’s accounts counts the same.</p>
    <h2 id="h-keep-own">Keep as the account’s own</h2><p>A transfer in from the budget’s accounts counts as money moved in for the reserves. When it’s savings of the account’s own, keep it as the account’s own: it then doesn’t count for the reserves, and <b>to move</b> no longer asks for it back.</p>
    <h2 id="h-unassigned">Unassigned</h2><p>Money that landed here other than by a transfer from the budget’s accounts: interest, a paycheck split into savings, a transfer from an account outside the budget. <b>Assign</b> gives it to the reserves or keeps it as the account’s own.</p>
    <h2 id="h-reserve">A reserve’s line</h2><p>What goes to each reserve held there. The lines start spread among the reserves by their balances; <b>Spread by balance</b> spreads it so again. Change any line, or empty it: what no line takes stays unassigned.</p>
    <h2 ${hid('Kept as the account’s own')}>Kept as the account’s own</h2><p>Savings that aren’t the reserves’ (not set aside).</p>
    <h2 id="h-withdrawals">Withdrawals</h2><p>Counted against the account’s <b>Withdrawals allowed a month</b>. Moves back are summed into one transfer for the month, with a warning when it would go past the limit.</p>
    <h2 ${hid('To')}>To</h2><p>The category that needs it; in an envelope budget, a card’s payment line, to cover what it owes but no envelope set aside.</p>
    <h2 ${hid('Amount to move')}>Amount to move</h2><p>For this month only. With rollover, or in a reserve, it carries on as any remainder does.</p>
    <h2 ${hid('Note')}>Note</h2><p>Why, for whoever reads the month later.</p>
    <h2 ${hid('Pays back')}>Pays back</h2><p>How much of the deposit pays this spending back. The rest of the deposit counts by its own category.</p>
    <h2 id="h-parent">Parent</h2><p>Categories are two levels deep: <i>Dining › Restaurants</i>.</p><h2 id="h-kind">Kind</h2><p>Expense, income, <b>savings</b> (money put away: a transfer to an account the budget doesn’t count, a loan’s principal), or a transfer, which never counts.</p><h2 id="h-tax-tag">Tax tag</h2><p>Feeds the tax screens: charitable, medical, business and so on.</p>
    <h2 id="h-keep-receipts-for">Keep receipts for</h2><p>How many years receipts attached to this category’s transactions are kept after the record they are attached to ended (a transaction on its date, a purchase once its lot is sold), before an admin can prune their files. Empty keeps them for ever, the default. A subcategory without its own takes its parent’s. The records themselves are never removed.</p>`,
  projections: `<h1>Projections</h1><p>How your money might grow toward a goal: retirement, education or a savings target. A model, not a forecast.</p><div class="shot">screenshot · projections</div>
    <h2>Active</h2><p>The plans you follow: at most one per person or couple for retirement, per child for education, per savings target. Each shows on the Dashboard’s Plans card, and on the account or portfolio it is built on.</p>
    <h2>Scenarios</h2><p>Projections that aren’t active: what-ifs to compare. <b>Make active</b> fixes a new baseline and replaces the active plan for the same goal.</p>
    <h2>Tracking</h2><p>Your actual balance against the baseline fixed when the plan became active: on track inside its 10th–90th band, ahead above it, behind below it. Falling behind raises an alert. In a projection shared with you, you see the status, and the balance of only the accounts shared with you too; when some aren’t, there is no band to show it against.</p>
    <h2>Re-baseline</h2><p>Makes today’s plan the one you’re tracked against, after you change its inputs.</p>
    <h2>Show on my Dashboard</h2><p>For a plan someone shares with you. Off by default, so other people’s plans don’t fill your Dashboard.</p>
    <h2 id="h-built-on">Built on</h2><p>A portfolio or chosen accounts, read at their current values each time, or a typed amount for a what-if.</p>
    <h2 id="h-who">Who</h2><p>One person, or a couple: each with their own birth year, retirement age and Social Security.</p>
    <h2 id="h-retirement-age">Retirement age</h2><p>Contributions stop and withdrawals start.</p>
    <h2 id="h-partner-retirement-age">Partner retirement age</h2><p>For a couple, the second person’s.</p>
    <h2 id="h-contribution-per-year">Contribution per year</h2><p>Added until retirement.</p>
    <h2 id="h-grows-yearly-by">Grows yearly by</h2><p>How much the contribution rises each year, such as with pay rises.</p>
    <h2 id="h-withdrawal">Withdrawal</h2><p>A percentage of the balance each year, or a fixed amount that rises with inflation.</p>
    <h2 id="h-other-income">Other income</h2><p>Social Security and pensions, each from an age, which reduce what the savings must pay.</p>
    <h2 id="h-expected-return">Expected return</h2><p>From your assumptions in Profile unless you override it here.</p>
    <h2 id="h-volatility">Volatility</h2><p>How much a year can swing. From your assumptions unless overridden.</p>
    <h2 id="h-target-amount">Target amount</h2><p>What the savings target needs, such as a house deposit.</p>
    <h2 id="h-target-date">Target date</h2><p>When it’s needed.</p>
    <h2 id="h-contribution-per-month">Contribution per month</h2><p>What you plan to add each month.</p>
    <h2 id="h-name">Name</h2><p>How the projection is listed.</p>`,
  taxes: `<h1>Taxes</h1><p>For one tax book: what a preparer or tax software needs, from your own records.</p><div class="shot">screenshot · taxes</div>
    <h2 id="h-tax-book">Tax book</h2><p>One user, or a married couple filing jointly, for one tax year. It holds the documents received and a filing per return. Each family member who files has their own; a couple filing separately has two.</p>
    <h2 ${hid('Year')}>Year</h2><p>The calendar year the returns are for.</p>
    <h2 ${hid('Filing together')}>Filing together</h2><p>Whether this tax book is for a married couple filing one joint return.</p>
    <h2 ${hid('Filers')}>Filers</h2><p>One user, or two who are married. A filer you name is asked to accept before their accounts count.</p>
    <h2 ${hid('Start from last year')}>Start from last year</h2><p>Copies the filers, accounts and dependents. Last year’s received documents become this year’s expected ones.</p>
    <h2 ${hid('Bitcoin network fees')}>Bitcoin network fees</h2><p>Paying a network fee in bitcoin disposes of those sats, so by default each fee is a sale at that day’s price, with its small gain or loss in Form 8949. A preparer who reads fees on transfers between your own accounts as not taxed can choose that instead.</p>
    <h2>Dependents</h2><p>The people the filers claim this year, from the household’s people, each with how they’re claimed, months lived with you and whether a student. They feed the credits, education and documents panels, and a dependent child’s unearned income above the year’s threshold is flagged for Form 8615. A person claimed on two tax books for one year is flagged on both, without saying whose the other is. A new tax book copies them, a year older.</p>
    <h2 ${hid('Claimed as')}>Claimed as</h2><p>Qualifying child or qualifying relative, suggested from the family tree. MoolaKata doesn’t decide who qualifies.</p><h2 ${hid('Months lived with you')}>Months lived with you</h2><p>As you’ll state it on the return.</p><h2 ${hid('Person')}>Person</h2><p>Anyone among the household’s people.</p><h2 ${hid('Accounts in their name')}>Accounts in their name</h2><p>The accounts the tax book counts that are the dependent’s, such as a custodial account. A dependent child’s interest, dividends and gains in them are checked against the year’s Form 8615 threshold.</p>
    <h2 ${hid('Accounts counted')}>Accounts counted</h2><p>The filers’ own accounts, each once. Add one you can see, such as a custodial account, or leave one out; the panels say what was left out.</p>
    <h2>Sharing a tax book</h2><p>The filers own it. Share it with a user who helps prepare the return: <b>Write</b> lets them edit filings, attach documents and resolve issues, but not delete it or change its sharing. It can also go, read only, to named people on a linked server, such as a preparer with a server of their own.</p>
    <h2 id="h-filings">Filings</h2><p>One per return: federal, a state’s, or a locality’s. An amended return is a filing of its own.</p>
    <h2 ${hid('Jurisdiction')}>Jurisdiction</h2><p>Federal, a state, or a locality such as a city.</p>
    <h2 ${hid('Form')}>Form</h2><p>The return’s form: Form 1040, Form 1040-X, a state’s form such as TC-40.</p>
    <h2 ${hid('Amends')}>Amends</h2><p>For an amended return, the filing it corrects. An amended federal return settles the edits made since the return was filed, and opens the year for edits until it is filed itself.</p>
    <h2 ${hid('Filing status')}>Filing status</h2><p>As filed. MoolaKata records it and never chooses it.</p>
    <h2 ${hid('Prepared by')}>Prepared by</h2><p>Yourself and the software you used, or your preparer.</p>
    <h2 ${hid('Sent by')}>Sent by</h2><p>E-file or paper.</p>
    <h2 ${hid('Progress')}>Progress</h2><p>Not started, in progress, filed, accepted or rejected. A filing past its due date that isn’t filed and has no extension shows on the Dashboard.</p>
    <h2 ${hid('Due date')}>Due date</h2><p>Federal from Settings › Tax tables; type others.</p>
    <h2 ${hid('Extension')}>Extension</h2><p>The date the extension was filed and the new due date. An extension to file is not an extension to pay.</p>
    <h2 ${hid('Date filed')}>Date filed</h2><p>When it was sent or postmarked.</p>
    <h2 ${hid('Confirmation number')}>Confirmation number</h2><p>The e-file submission ID, or the mailing receipt for paper.</p>
    <h2 ${hid('Result')}>Result</h2><p>A refund, an amount owed, or nothing due.</p>
    <h2 ${hid('Amount')}>Amount</h2><p>The refund or the amount owed, as on the return.</p>
    <h2 ${hid('Paid or received in')}>Paid or received in</h2><p>The transaction that paid it or received the refund.</p>
    <h2 id="h-from-last-year">From last year</h2><p>Figures typed from last year’s filed return that this year’s preparation needs.</p>
    <h2 ${hid('Adjusted gross income')}>Adjusted gross income</h2><p>Last year’s AGI. You need it to sign an e-filed return.</p>
    <h2 ${hid('Total tax')}>Total tax</h2><p>Shown beside this year’s estimated payments.</p>
    <h2 ${hid('Overpayment applied')}>Overpayment applied</h2><p>Last year’s refund kept as a payment toward this year.</p>
    <h2 ${hid('Capital-loss carryover')}>Capital-loss carryover</h2><p>Losses not used yet, short and long term. Counted in the Summary.</p>
    <h2 ${hid('Form 8606 basis')}>Form 8606 basis</h2><p>Non-deductible IRA contributions not yet recovered. Used in the backdoor-Roth figures.</p>
    <h2 ${hid('Charitable carryover')}>Charitable carryover</h2><p>Donations over last year’s limit that carry into this year.</p>
    <h2 ${hid('Kind')}>Kind</h2><p><b>Received</b>: W-2s, 1099s and other forms sent to you, kept in the tax book. <b>Filed</b>: the return as filed and what the tax authority sends, kept in its filing.</p>
    <h2 ${hid('Document')}>Document</h2><p>The form or kind of letter.</p>
    <h2 ${hid('Issued by')}>Issued by</h2><p>The employer, broker, bank or tax authority.</p>
    <h2>Statement values</h2><p>A brokerage statement’s ending value against what MoolaKata says the account was worth that day, cash and holdings at that day’s prices; within half a percent counts as a match.</p>
    <h2>Holdings check</h2><p>The positions of the latest brokerage statement or broker’s file against what MoolaKata holds that day: a quantity that differs is shown with the difference, a missed split or a reinvestment not entered yet. Positions never change the lots; a transaction does.</p>
    <h2 ${hid('Account')}>Account</h2><p>The account a received form reports on. A 1099-B is reconciled against it.</p>
    <h2 ${hid('Filing')}>Filing</h2><p>The return a filed document belongs to.</p>
    <h2 ${hid('File')}>File</h2><p>The PDF or a photo. It is kept with your receipts, with the same protection.</p>
    <h2 ${hid('Notes')}>Notes</h2><p>What it says, and what you did about it.</p>
    <h2 id="h-capital-gains">Capital gains (8949)</h2><p>Every sale as a Form 8949 row. Box A/D: basis reported to the IRS. Code <b>W</b>: wash sale.</p>
    <h2 id="h-exports">Exports</h2><p>CSV for 8949, TXF for TurboTax and others, and a PDF packet with receipts for a preparer. TXF has no place for a digital asset’s box (G to L) or for the codes C (a collectable) and L (a personal-use loss), so those sales are left out of it, counted beside it, and entered from the CSV.</p>
    <h2 id="h-documents">Documents</h2><p><b>Received</b>: the forms your accounts should produce. Attach the PDF when it arrives; a 1099-B is reconciled against MoolaKata’s totals. <b>Filed</b>: each filing’s forms as filed and the tax authority’s letters, kept because next year often needs them.</p>
    <h2>Giving</h2><p>Deductible donations by type, with acknowledgements flagged where the rules need them: $250 or more in one gift, Form 8283 for goods over $500, an appraisal over $5,000. DAF grants and gifts to people are listed as not deductible.</p>
    <h2>Education and gifts</h2><p>529 contributions and distributions against qualified expenses, and anyone who received more than the annual exclusion from you, as a prompt for Form 709.</p>
    <h2>Loans and property</h2><p>Mortgage interest, points, PMI and escrowed property tax (Form 1098), student-loan interest (1098-E), and physical assets sold, with collectables marked for their rate.</p>
    <h2 id="h-issues">Issues</h2><p>Missing or doubtful data to look at before the return is prepared. An edit made anyway to a year whose federal return is filed is listed first, with how far it moved the realized gains and in which accounts. <b>Add an amended return</b> goes to Filings: one that amends the federal return settles the edits, and opens the year for edits until it is filed. <b>No amendment needed</b> settles them instead.</p>
    <blockquote>MoolaKata doesn’t compute the tax owed and isn’t tax advice.</blockquote>`,
  receipts: `<h1>Receipts</h1><p>PDFs and photos of receipts, attached to transactions and tax items.</p><div class="shot">screenshot · receipts</div>
    <h2 id="h-inbox">Inbox</h2><p>Receipts not attached to anything yet. Attaching suggests transactions with the same amount and date.</p>
    <h2 id="h-attach-to">Attach to</h2><p>A transaction, a tax item, or a tax document. Attaching and detaching are saved with the receipt’s other changes, on <b>Save</b>. People who can see the transaction see its receipts, and only what it is kept with that they can see: the rest is counted, <i>Also kept with 1 thing not shared with you</i>, never named.</p>
    <h2 id="h-reading">Reading</h2><p>MoolaKata reads each receipt on this server: a PDF’s own text when it has some, otherwise OCR. Nothing is sent anywhere. It fills the empty fields, marked <i>read from the receipt</i> with how sure it is, and suggests the transaction it belongs to. Check them, attach it, then save.</p>
    <h2 id="h-date">Date</h2><p>The date printed on the receipt.</p><h2 id="h-amount">Amount</h2><p>The total: the amount due, not the subtotal or the tax.</p><h2 id="h-payee">Payee</h2><p>The merchant, tidied by your payee rules.</p>
    <h2 id="h-read-again">Read again</h2><p>Reads the receipt again. Only empty fields and ones filled by an earlier reading change; what you typed stays.</p>
    <h2 id="h-search">Search</h2><p>Searches the text read from every receipt, so <code>blue bottle</code> or <code>142.18</code> finds it.</p>
    <h2 id="h-notes">Notes</h2><p>Anything worth keeping with it.</p><h2 id="h-tags">Tags</h2><p>Your own labels, for finding receipts later.</p>
    <h2>Kept until</h2><p>When the file may be pruned: its category’s period after its record ended (a purchase’s once its lot is sold), in bold within 90 days. The category is named only when what sets it is shared with you, else <i>Kept for something not shared with you</i>. <b>Keep</b> holds it for ever, for a warranty or a medical bill an HSA may repay later.</p>`,
  watchlist: `<h1>Watchlist</h1><p>Instruments you follow without holding them. Prices are delayed.</p>`,
  activity: `<h1>Activity</h1><p>What changed and who did it. Amounts are never shown here.</p>`,
  users: `<h1>Users and Groups</h1><p>Admins invite people, approve sign-ups, and make groups to share with. Admins see only the money shared with them.</p><div class="shot">screenshot · users</div>
    <h2 ${hid('New user')}>New user</h2><p>A name, username and email: they get an invitation and choose their own password. Admins never set passwords.</p>
    <h2 ${hid('Name')}>Name</h2><p>As others see it.</p>
    <h2 ${hid('Username')}>Username</h2><p>What they sign in with: lowercase letters, digits, dots, dashes or underscores.</p>
    <h2 ${hid('Email address')}>Email address</h2><p>Where the invitation goes. Fixed here only before they join; afterwards they change it themselves.</p>
    <h2 ${hid('Groups')}>Groups</h2><p>Their groups. <b>Admins</b> makes them an admin.</p>
    <h2 ${hid('Active')}>Active</h2><p>Off ends the user’s sessions at once and stops them signing in; shares they hold give them nothing while they’re inactive. Users are made inactive, never deleted. The last active admin can’t be.</p>
    <h2 ${hid('Reset two-step')}>Reset two-step</h2><p><b>two-step</b> beside a user means they sign in with a code from an app. Reset turns it off, the last resort when they’ve lost both the app and their recovery codes: their password alone then signs them in, they’re signed out everywhere, and they’re emailed.</p>
    <h2 ${hid('New group')}>New group</h2><p>A named set of users that items can be shared with.</p>
    <h2 ${hid('Group name')}>Group name</h2><p>What shares name it by.</p>
    <h2 ${hid('Members')}>Members</h2><p>A member holds the group’s shares while in it.</p>`,
  settings: `<h1>Settings</h1><p>The server’s configuration, for admins. Each section has its own guide in the app.</p><div class="shot">screenshot · settings</div>
    <h2>Connector</h2><p>The MoolaKata Connector is a second service that keeps people’s sign-ins at their institutions, fetches with its drivers, and pushes what it fetches into imports. MoolaKata can’t reach it or read its vault: it only hears its signed reports. It starts locked after every restart; an admin unlocks it on its page, with its 12 words, or on its host. <b>Pair</b> shows a code to paste into the connector’s page with its words (or to run on its host), since the key that opens sealed credentials is made then and kept in the vault. <b>Confirm</b>, after comparing the fingerprint both sides show: until then the connector gets no sign-in and posts no file. <b>Unpair</b> at once when the connector’s host or volume is lost: the copy holds only its status key, which can say no more than that the connector is locked; the vault, with the sign-ins and the keys that act as the connector and open sealed credentials, stays closed without the words. A report from an address other than the known one is alerted until an admin presses <b>Accept</b> (the connector moved) or unpairs.</p>
    <h2 id="h-its-page">Its page</h2><p>The connector serves a small page of its own, on its own port, where its vault is made and its words are given: <b>Unlock</b> after a restart, <b>Lock</b>, <b>Pair</b> with the code from here, <b>Unpair</b> and <b>Reset</b>. Anyone on the network can see its status there, which names no institution, sign-in or account; every action asks for the words. MoolaKata only links to it and never sees the words.</p>
    <h2 ${hid('The connector reaches MoolaKata at')}>The connector reaches MoolaKata at</h2><p>The address a pairing code carries, where the connector sends its reports and files under <code>/connector/</code>. The connector usually runs on the household’s own network, so this is often the server’s own address there, not a public URL that leads out through a proxy or a tunnel and back. Empty, the public URL is used; never the link address, whose proxy may pass only <code>/link/</code>. A change applies to the next pairing.</p>
    <h2 id="h-new-address">A new address</h2><p>Each report’s address is recorded, the first one as known. A report from another address raises an alert for admins, and it stays whichever address reports next. <b>Accept the new address</b> (your password again) when the connector moved: a new host, a new network. If it didn’t, someone may hold a copy of its host or volume and be reporting as it: <b>Unpair</b> at once, then pair it again from its own host.</p>
    <h2>Certificate</h2><p>An Electrum server’s certificate is trusted on first use: <b>Test</b> shows its fingerprint and you confirm it. If the server later presents another, MoolaKata stops reading through it and alerts admins until you trust the new one.</p>
    <h2 id="h-server-name">Server name</h2><p>Shown to linked servers.</p>
    <h2 id="h-public-url">Public URL</h2><p>The address people use. Links in emails are built from it, never from the request.</p>
    <h2 id="h-idle-timeout">Idle timeout</h2><p>How long a session lasts without use.</p><h2 id="h-minimum-length">Minimum length</h2><p>12 by default, 8 to 128. The other rules are fixed: at most 1,024 characters, and none of the most common passwords.</p>
    <h2 id="h-allowed-email-domains">Allowed email domains</h2><p>Limits sign-up requests to these domains.</p>
    <h2 id="h-price-sources">Price sources</h2><p>Where daily prices come from: free sources, each serving some classes of instrument. The first enabled source for a class is used, the next if it fails. <b>Add a source</b> picks from those MoolaKata ships.</p>
    <h2 id="h-daily-refresh-at">Daily refresh at</h2><p>When the day’s closes are fetched, after the US market close.</p>
    <h2 id="h-source">Source</h2><p>An integration MoolaKata ships: what it serves, and whether it needs a key.</p>
    <h2 id="h-api-key">API key</h2><p>For a source that needs one. Most offer a free key. It is stored encrypted and shown only as set.</p>
    <h2>Valued without a source</h2><p>529 portfolios, 401(k) trusts and individual bonds have no free ticker. Their value comes from a statement, an import or a bank-sync balance.</p>
    <h2 id="h-linked-servers">Linked servers</h2><p>Other MoolaKata servers that share read-only with this one. <b>Invite a server</b> makes a one-time code; the other admin enters it, and you approve after comparing fingerprints.</p>
    <h2 id="h-link-code">Link code</h2><p>From the other server’s admin. Valid once, for 24 hours.</p>
    <h2 id="h-this-server-s-link-address">This server’s link address</h2><p>Where other servers reach this one, without a path: MoolaKata answers them under <code>/link/</code>. It must be reachable by the other server: a forwarded port, a reverse proxy, or both on Tailscale or WireGuard. Empty, the public URL is used. A link works when either side can reach the other.</p>
    <h2>Sync progress</h2><p>A first full sync, or a large change, arrives oldest first, so the linked household’s copy fills from its earliest records. While it runs, the link shows how far it has come in time and in size: <i>Up to July 2022 (47 MB of 2 GB)</i>.</p>
    <h2>Broken</h2><p>The other server answered that it has no link with this one, restored from an older backup, say. End the link, or link again: a new link code, made and entered on either side, replaces this link, and the new link pulls everything afresh. Only the other server ending the link ends it here.</p>
    <h2 id="h-certificate-changed">Its certificate changed</h2><p>The connection to each server is TLS, checked before anything is sent: a public certificate against the trusted roots, a server’s own certificate by its key, pinned when the link was made. A server whose own key changes tells its peers first; one that presents a key it didn’t announce is refused until you compare the new key with its admin and <b>Accept it</b>, after your password again. What crosses a link is sealed to the receiving copy’s key, so nothing in between reads it.</p>
    <h2 id="h-pause-for">Pause for</h2><p>How long the link stays paused, then resumes on its own: a duration such as <code>1d</code> (the default), <code>12h</code>, or <code>2w 3d 4h</code> for two weeks, three days and four hours. Units are w, d, h and m, largest first. <b>Resume now</b> ends a pause early.</p>
    <h2>Users on linked servers</h2><p>Each linked server’s active users, sent at every pull and updated in place. They can be chosen when sharing, always read only, and never sign in here, join a group or own anything.</p>
    <h2 id="h-outgoing">Shared from here</h2><p>What this server sends each linked server at its pulls: each item shared with people there, by its kind and its owner here, since when, and the people there it names. They see it read only, and only what changes travels after the first pull.</p>
    <h2>Shared from a linked server</h2><p>The owner on the other server chooses who here sees each share, from this server’s list of users, which links exchange. You see only the kind, the owner, the date and who it names.</p>
    <h2>Linked copies</h2><p>Each link’s data is kept in its own encrypted copy, under its own <b>access key</b>: 12 words. The master key can’t open it. <b>Waiting</b> counts changes pulled while it was locked. Once someone enters the words, the copy is unlocked for everyone it shares with, until it goes unused.</p>
    <h2>Create the access key</h2><p>When a link’s first share arrives. MoolaKata shows the 12 words once: save them in the household’s password manager. Knowing the words opens nothing without a share.</p>
    <h2 id="h-release-linked-keys-after">Release linked keys after</h2><p>How long an unlocked copy’s key stays in memory with nobody viewing it. One hour by default. Background syncing doesn’t count as viewing.</p>
    <h2 id="h-household">Household</h2><p>Your household’s avatar: shown at the top of the sidebar, and on linked servers, which always show it as you set it.</p>
    <h2 id="h-alert-when-a-source-has-failed-for">Alert when a source has failed for</h2><p>How long a price source, email, the bitcoin explorer or node, or a linked server may fail before admins, and a wallet’s owner, are alerted. 48 hours by default.</p>
    <h2 id="h-daily-summary-at">Daily summary at</h2><p>When the daily summary email goes out to those who chose it.</p>
    <h2 id="h-statement-types">Statement types</h2><p>What can be uploaded as a statement: PDFs, and photos or scans.</p>
    <h2 id="h-largest-statement">Largest statement</h2><p>The size limit for one statement file.</p>
    <h2 id="h-explorer-or-node">Explorer or node</h2><p>Where bitcoin wallets are read: a public explorer, or your own node (mempool or Esplora, an Electrum server such as Fulcrum or electrs, or Bitcoin Core). Your own node keeps your addresses private. No wallet is read until this section is saved.</p>
    <h2 id="h-node-address">Node address</h2><p>Your node’s host name or address on the LAN. Naming it here lets MoolaKata reach it. Changing it clears the node’s stored password, so it is never sent to the new host.</p>
    <h2 ${hid('Node port')}>Node port</h2><p>50002 for an Electrum server with TLS, 50001 without; 8332 for Bitcoin Core.</p>
    <h2 ${hid('TLS')}>TLS</h2><p>An Electrum server’s TLS, usually on. Its certificate, usually one it made itself, is trusted on first use: Test shows its SHA-256 fingerprint, you confirm it, and any other is refused until you confirm the new one.</p>
    <h2 id="h-node-password">Node password</h2><p>Bitcoin Core’s RPC password, with its <b>RPC user</b>. Stored encrypted, never shown again.</p><h2>Test</h2><p>Asks the saved explorer or node for the chain’s height. Wallets are read every hour; a wallet’s <b>Check now</b> reads it at once.</p>
    <h2 id="h-household-name">Household name</h2><p>Shown with the avatar, here and on linked servers.</p>
    <h2>Reset copy</h2><p>If the words are lost. Deletes the copy, makes new words, and pulls everything again. Each person enters the new words once. Nothing is lost: the other server keeps the data.</p>
    <h2 id="h-tax-tables">Tax tables</h2><p>Contribution limits and thresholds by year, shipped with the app.</p>
    <h2 id="h-read-receipts">Read receipts</h2><p>Reads each uploaded receipt on this server with RapidOCR and suggests its fields and transaction. On by default.</p>
    <h2 id="h-jobs-at-a-time">Jobs at a time</h2><p>How many receipts are read at once. 1 suits a small server; each job takes up to 2 CPU threads.</p>
    <h2 id="h-file-sandbox">Without its file sandbox</h2><p>Every file someone brings is opened only by the reader’s own process, which gives up what it doesn’t need first: no network at all, and on Linux 5.13 or later (Landlock) no way into the data directory. It uses Landlock wherever the host offers it. On a host that doesn’t (an older kernel, or a container that doesn’t allow it), the section says the reader runs without that file sandbox, and admins have an alert while it lasts.</p>
    <h2 id="h-re-read-all-receipts">Re-read all receipts</h2><p>After an update brings better models. Only empty fields and earlier readings change.</p>
    <h2 id="h-key-storage">Key storage</h2><p>The database, the receipt files, the backups and every secret are encrypted. All of it opens with the <b>master key</b>, which is the recovery phrase and is never stored: the server starts locked and an admin enters the phrase, which unwraps a data key kept wrapped in the data directory. Linked copies are not under the master key; their own access keys open them.</p>
    <h2 id="h-unlocked">Unlocked</h2><p>When the phrase was last entered. The server locks again at every restart, until someone enters it on the locked screen or with <code>moolakata keys unlock</code> on the host.</p>
    <h2 id="h-test">Test</h2><p>Checks, writing nothing, that the keyring on disk is the one the phrase unlocked, and that the database and a secret open with the data key in memory. Activity records the test.</p>
    <h2 id="h-recovery-phrase">Recovery phrase</h2><p>The master key written as 12 words. A new server’s welcome shows it once and asks for three words back; nothing shows it again. Keep it in two places, one offline.</p><h2 id="h-verify-key">Verify key</h2><p>Type the 12 words from one of your copies: MoolaKata checks that they open this server’s key, changes nothing, and records the check. Do it once a year for each copy, and whenever you make a new one; the yearly alert opens it. A wrong phrase counts toward the lockout, as at the locked screen. <code>moolakata keys verify</code> on the host does the same.</p><blockquote>Without the recovery phrase, the data and every backup are lost, and the server cannot start serving. Nobody can recover them.</blockquote>
    <h2 id="h-previous-keys">Previous keys</h2><p>The master keys this server was rotated away from, each with how many copies here still need its phrase. A rotation re-encrypts every copy it is told to, so the count is usually none; the host’s own snapshots and backups made before the rotation still open with that phrase for as long as the host keeps them. <b>Forget</b> drops a key from the list once nothing needs it.</p>
    <h2 id="h-copies-on-this-host">Copies on this host</h2><p>Every copy MoolaKata can see: the backups in the backup directory, the copies made before a migration, what a restore set aside, and a new keyring a re-encryption left unexplained. Each carries its own keyring and says how it opens. <b>Remove</b> deletes one, after your password and the phrase. The host’s own snapshots and backups are copies too, outside this list.</p>
    <h2 id="h-last-reencryption">Last re-encryption</h2><p>When the last re-encryption finished and why (a rotation, Settings or the host), anything it set aside, and what it did with each copy: a copy left under an old key is marked, since it still opens with the old phrase. A rotation that didn’t finish is said here: rotate again.</p>
    <h2 id="h-rotate">Rotate</h2><p>A new recovery phrase, and a new data key with it: for a leaked or lost phrase, or the yearly reminder. It asks for your password and the current phrase, or a <b>break-glass code</b> from the host when the phrase is lost (<code>docker compose exec moolakata moolakata keys break-glass</code>: once, for 15 minutes, and every admin is told), and what to do with each copy on this host. It then shows the new phrase once and takes three of its words back. MoolaKata restarts, and the unlock with the new phrase re-encrypts everything before it serves. Keep the old phrase until every copy made under it is gone.</p>
    <h2 id="h-current-recovery-phrase">Current recovery phrase</h2><p>The server’s 12 words, as they are now, with your password: a session someone took over can’t change the phrase the household holds. A wrong phrase counts like a wrong password.</p>
    <h2 id="h-break-glass-code">Break-glass code</h2><p>The code <code>keys break-glass</code> printed on the host, such as <code>BG-7K3Q-9XWM</code>, in any case, with or without its dashes.</p>
    <h2 id="h-words-back">Words back</h2><p>Three of the new phrase’s words, from your sheet. Four letters of each are enough. <b>Rotate and restart</b> then rotates, and MoolaKata restarts; the page waits for it on the locked screen.</p>
    <h2 id="h-lost-phrase">The phrase is lost</h2><p>While the server runs, a lost phrase is replaced by rotating, with a break-glass code from the host in its place. Once the server stops, nothing opens the data: rotate now.</p>
    <h2 id="h-re-encrypt">Re-encrypt now</h2><p>A new data key, the phrase unchanged. MoolaKata restarts at once, locked, and the unlock, before the server serves, re-keys the database, re-encrypts the receipt files and gives every secret a fresh key, after a verified backup. The phrase given at that unlock wraps the new key, and the locked screen shows the progress. It asks, for each copy on this host, whether to re-encrypt it (the default), delete it or leave it; a backup made since, the run’s own first one among them, is re-encrypted too. For when the data key may have been read: a memory dump or a debugging session. A leaked phrase calls for a rotation, which re-encrypts too. It closes nothing made before it: every earlier copy still opens with the key it was made under, so a leak also means deleting those copies wherever they are.</p>
    <h2 id="h-scheduled">Scheduled</h2><p>A re-encryption waiting for the restart: the unlock runs it before the server serves.</p>
    <h2 id="h-after-restore">After a restore</h2><p>The first unlock after a restore opens every receipt file and secret with the restored keys and lists what doesn’t open: receipts to put back from the host’s own backup of the same moment, and secrets to enter again.</p>
    <h2 id="h-remind-admins-to-rotate-after">Remind admins to rotate after</h2><p>How old the master key may get before admins are alerted to rotate it: 12 months by default, or never. A rotation brings a new data key as well.</p>
    <h2 id="h-host">Host</h2><p>Your mail server’s address. Changing it asks for your password again and clears the stored SMTP password, so it is never sent to the new host.</p>
    <h2 id="h-port">Port</h2><p>Usually 587 for STARTTLS or 465 for TLS.</p>
    <h2 id="h-security">Security</h2><p>STARTTLS or TLS. None only on a trusted LAN.</p>
    <h2 id="h-username">Username</h2><p>The account MoolaKata sends mail as.</p>
    <h2 id="h-password">Password</h2><p>Stored encrypted and shown only as set.</p>
    <h2 id="h-from-address">From address</h2><p>What recipients see as the sender.</p>
    <h2 id="h-longest-session">Longest session</h2><p>Signed out after this long, used or not.</p>
    <h2 id="h-written-to-the-mail-folder">Written to the mail folder</h2><p>The emails written while no host was set, for an admin to pass their links on. <b>Open</b> shows one after your password, and records it in Activity for the person it is addressed to. Each is removed once its link has expired: a password reset’s after an hour, an invitation’s after a week, the others’ after a day.</p>
    <h2 id="h-failed-sign-ins-before-a-lockout">Failed sign-ins before a lockout</h2><p>Wrong passwords or codes in 15 minutes, from one address, that lock that address. 10 by default. A username that keeps failing from anywhere is only slowed, never locked.</p>
    <h2 id="h-lockout">Lockout</h2><p>How long a locked address waits. A username that keeps failing is only slowed, never locked.</p>
    <h2 id="h-largest-file">Largest file</h2><p>The size limit for one receipt.</p>
    <h2 id="h-time-of-day">Time of day</h2><p>When the daily backup runs, in the server’s time zone.</p>
    <h2 id="h-days-of-backups-kept">Days of backups kept</h2><p>More days keeps more. Fewer days than the backups there are deletes some at the next backup, which can’t be undone, so it asks for the recovery phrase too.</p>
    <h2 id="h-copies-kept">Copies kept</h2><p>How many days of backups are kept: every backup of each of the most recent days that have one, 14 by default and never fewer than 3; older days’ are pruned (backup pruning). A second backup the same day never pushes out an earlier day’s. Fewer days than the backups there are deletes some, so <b>Change</b> asks for the recovery phrase too, as <b>Remove</b> does.</p>
    <h2>Storage</h2><p>How much space the database and the files take. Records are never removed; only receipt and statement files whose retention has run out can be pruned, by an admin. Each category says how long its receipts are kept, for ever by default, and statements have their own period here. The bars show what expires each coming year.</p>
    <h2 id="h-keep-statements-for">Keep statements for</h2><p>Years after a statement’s last transaction. Empty keeps them for ever.</p>
    <h2>Prune</h2><p>Removes the expired files, by category. Each record keeps its row and shows <i>File pruned</i>. A backup holds no files, so a pruned file survives only in the host’s own backups of the data directory, for as long as the host keeps them.</p>
    <h2 id="h-type-the-number-of-files-to-confirm">Type the number of files to confirm</h2><p>So pruning is never started by a slip.</p>
    <h2 id="h-allowed-to-use-the-app">Allowed to use the app</h2><p>Address ranges that may reach /ui, and /mcp with it: an agent sits where a person’s browser does. Empty allows any. While the server is locked these ranges can’t be read, so the locked screen answers whatever the proxy lets through.</p>
    <h2 id="h-allowed-to-link">Allowed to link</h2><p>Address ranges linked servers call from.</p>
    <h2 id="h-allowed-to-connect">Allowed to connect</h2><p>Address ranges the MoolaKata Connector calls from: the LAN and the overlay by default. Running it on a laptop away from home means adding where that laptop calls from.</p>`,
  linked: `<h1>Linked household</h1><p>What another household shares with you, in a window of its own. Everything here is read only, as their server worked it out, and never mixed with your own accounts or totals.</p>
    <h2 id="h-access-key">Access key</h2><p>The copy’s 12 words, kept in your household’s password manager. Whoever opens it first enters them; it then stays open for everyone it shares with until nobody has viewed it for an hour. Each word is recognised by its first four letters.</p>
    <h2>Who sees what</h2><p>The owner on the other server chooses who here sees each item. Once it’s open, you see only what is shared with you.</p>
    <h2>Lock now</h2><p>Locks the copy for everyone at once. It also locks after an hour unused and when the server restarts.</p>
    <h2 id="h-colour">Colour</h2><p>Tints this household’s window for you. The name and avatar always come from their server.</p>
    <blockquote>A locked copy keeps syncing. Changes wait, encrypted, and are applied when it opens.</blockquote>`,
  alerts: `<h1>Alerts</h1><p>What needs you. Activity records what happened; an alert asks for something to be done.</p><div class="shot">screenshot · alerts</div>
    <h2>Open</h2><p>One alert per cause, newest first. It resolves by itself when the cause clears, such as a sync succeeding again. An admin who owns what failed, such as their own Connection, sees it once, as its owner. <b>Dismiss</b> hides it for you only.</p>
    <h2>What raises one</h2><p>For admins: a sync source failing for more than 48 hours (set in Settings › Alerts), a failed backup, a linked server’s share waiting for its access key, the MoolaKata Connector locked or not heard from for 15 minutes, the yearly check of the recovery phrase, and the receipt reader running without its file sandbox on a host that doesn’t offer Landlock. For an account’s owner: their own sync failing, a statement overdue, and a holding still valued from a statement over 90 days old. For everyone: an occasion coming up, an option about to expire, a pledge due.</p>
    <h2>The badge</h2><p>Counts the open alerts you haven’t seen. New ones arrive without a reload.</p>
    <h2>Emails</h2><p>Each alert, a daily summary, or none: your choice in Profile. They never show amounts.</p>`,
  profile: `<h1>Profile</h1><p>Your name, email, password and two-step sign-in, and the facts the tax screens need.</p>
    <h2>Connections</h2><p>Your sign-ins at institutions, kept by the MoolaKata Connector. What you type for one is encrypted in your browser for the connector, so MoolaKata never holds it. A sign-in that expires, as Schwab’s does each week, asks you again here.</p>
    <h2 id="h-institution">Institution</h2><p>The driver to use: Schwab, or an OFX Direct Connect server. What no driver can fetch is downloaded on your own desktop and imported by hand. An OFX sign-in is bound to the server address it was sealed for: the connector sends it there and nowhere else, and a changed address asks for the sign-in again.</p>
    <h2 id="h-connection-name">Connection name</h2><p>How you’ll know this sign-in: <i>Schwab login</i>.</p>
    <h2 ${hid('OFX server address')}>OFX server address</h2><p>The institution’s OFX Direct Connect address. The sign-in is bound to it: the connector sends it there and nowhere else. When the institution moves its server, change it here, with <b>Change credentials</b>: it is saved with your password again, and the sign-in you then seal is bound to the new one.</p>
    <h2 id="h-sealed-for">Sealed for</h2><p>The one host the connector will ever send this sign-in to: the OFX server’s, from its address, or the institution’s own (api.schwabapi.com for Schwab). It is sealed with the sign-in, so nothing changed later can send it elsewhere.</p>
    <h2 id="h-how-you-sign-in">How you sign in</h2><p>Here, sealed for the connector, or typed by an admin on the connector’s host, so MoolaKata never handles it at all.</p>
    <h2 id="h-username">Username</h2><p>Your sign-in at the institution, sealed in this browser for the connector with the password.</p>
    <h2 id="h-password">Password</h2><p>Your password there, sealed with the username: MoolaKata stores only the sealed box and can’t open it.</p>
    <h2 id="h-the-address-you-landed-on">The address you landed on</h2><p>After signing in on the institution’s own page, the address your browser lands on. It carries the sign-in for the connector.</p>
    <h2 ${hid('Bitcoin amounts')}>Bitcoin amounts</h2><p>Bitcoin is kept in whole sats, 100,000,000 to the bitcoin. Choose whether amounts show as BTC or as sats; nothing else changes.</p>
    <h2 id="h-time-zone">Time zone</h2><p><b>Auto</b> follows the server’s. Times are stored in UTC and shown in your zone. Dates such as a transaction’s or a birthday stay as written, and a daily close keeps its market day.</p>
    <h2 ${hid('Bitcoin in')}>Bitcoin in</h2><p>How amounts of bitcoin are shown to you: BTC (0.12345678 BTC) or sats (12,345,678 sats). They are kept to the sat either way.</p>
    <h2 id="h-alert-emails">Alert emails</h2><p><b>Each alert</b>: an email when an alert opens. <b>Daily summary</b>: one email a day listing new alerts, and none on a quiet day. <b>None</b>: on screen only. Emails never show amounts.</p>
    <h2>Assumptions</h2><p>Expected return and volatility per asset class, and inflation, shared by all your projections and the payoff planner, so they agree.</p>
    <h2 id="h-general-inflation">General inflation</h2><p>For today’s dollars and rising withdrawals. 2.5% by default.</p>
    <h2 id="h-education-inflation">Education inflation</h2><p>College costs rise faster. 5% by default.</p>
    <h2 id="h-bitcoin-model">Bitcoin model</h2><p>Your crypto assumption, or a published model: the power law, log regression (the “rainbow chart”), stock-to-flow, Saylor’s Bitcoin24 or ARK’s 2030 targets. <b>Compare models</b> shows them side by side with their sources and records. Models with bear, base and bull cases show those three paths instead of a fan.</p>
    <h2 id="h-ignored-statement-lines">Ignored statement lines</h2><p>The starts of statement lines you asked to ignore, with <b>Remember…</b> when checking a statement, by institution. <b>Remove</b> reads them again from its next statement.</p>
    <h2 id="h-access-tokens">Access tokens</h2><p>Let an AI assistant read your finances through MCP. A token reads only, never changes anything, and sees only what you can see, or the items you choose.</p>
    <h2 id="h-token-name">Token name</h2><p>So you can tell your tokens apart, and see each one’s calls in Activity.</p>
    <h2 id="h-can-read">Can read</h2><p>Everything you can see, or chosen items. Never secrets, Settings or linked households.</p>
    <h2 id="h-expires">Expires</h2><p>30 days, 90 days or a year. Revoke a token at any time.</p><h2 id="h-sex">Sex</h2><p>Chooses the words for the family tree: wife or husband, mother-in-law or father-in-law.</p><h2 id="h-birthday">Birthday</h2><p>For catch-up contribution limits, RMDs and your age in projections.</p>
    <h2>Relationships</h2><p>Your spouse or partner, children, friends and colleagues, each from a date and, once over, to a date. Parents, grandparents, cousins and in-laws are worked out from them. Your spouse is used for wash sales on each sale’s date, and for a joint tax book, once you have both confirmed the marriage: one your spouse entered shows <b>Confirm</b> here.</p>
    <h2 id="h-is-the">Is the</h2><p>Spouse, couple, parent, child, friend, colleague, or family (with a label, such as godmother).</p><h2 id="h-other-person">Other person</h2><p>Anyone in the household’s people.</p><h2 id="h-from">From</h2><p>When it began. Optional.</p><h2 id="h-to">To</h2><p>When it ended; empty while it holds. A death ends a marriage by itself.</p><h2 id="h-label">Label</h2><p>For family: godmother, aunt by marriage.</p><h2 id="h-person">Person</h2><p>You, or for an admin, anyone.</p>

    <h2 id="h-display-name">Display name</h2><p>How you appear to others here and on linked servers.</p>
    <h2 id="h-email-address">Email address</h2><p>For invitations, resets and alert emails. A change takes effect once you open the link sent to the new address.</p>
    <h2 id="h-two-step-sign-in">Two-step sign-in</h2><p>After your password, a code from an authenticator app on your phone, so a stolen password alone can’t sign in. <b>Turn on</b> shows a QR code to scan, then asks for a code to confirm. Ten <b>recovery codes</b> are shown once: each signs you in once if the phone is lost. Turning it on or off emails you.</p>
    <h2 id="h-code-from-the-app">Code from the app</h2><p>The six digits the app shows. If they’re refused, check the phone’s clock is set automatically.</p>
    <h2 id="h-current-password">Current password</h2><p>Needed to change it.</p>
    <h2 id="h-new-password">New password</h2><p>At least the minimum length an admin sets. Common passwords are refused.</p>`,
  share: `<h1>Share</h1><p>Give people, groups or people on linked servers access to this item.</p><h2>Read</h2><p>They see everything about it and can’t change it.</p><h2>Write</h2><p>They can also add and import transactions, categorise, and attach receipts. They can’t delete it, share it on, or see its keys.</p><h2>What can be shared</h2><p>Accounts, portfolios, budgets, people with their gifts, giving plans, tax books and projections, each shared on its own.</p><h2>People on linked servers</h2><p>Read only, always. You choose the people; their server confirms who they are, keeps it encrypted, and shows it in a window of its own.</p><h2>Include receipts</h2><p>Off by default. When on, the account’s receipts and the text read from them go to that server too, stored there as encrypted files.</p>
    <h2>Sharing a portfolio</h2><p>People see only the accounts in it that are shared with them; the rest are hidden and left out of its value. The dialog names them and offers to share them too.</p><h2>A tax book</h2><p>The filers own it; give <b>Write</b> to someone who helps prepare the return.</p>`,
};

});
document.addEventListener('change', (e) => {
  const el = e.target, num = +String(el.value).replace(/[^0-9.]/g, '') || 0;
  if (el.dataset.act === 'year') { state.year = +el.value; render(); }
  if (el.dataset.act === 'taxbook') { const b = TAX_BOOKS.find((x) => x.label === el.value); state.taxBook = b.id; state.year = b.year; setTimeout(render); }
  if (el.dataset.pf) { state.payoff[el.dataset.pf] = num; setTimeout(render); }
  if (el.dataset.goal) { state.goal[el.dataset.goal] = num; setTimeout(render); }
});
document.addEventListener('input', (e) => {
  const el = e.target; if (el.dataset.check !== 'seed') return;
  const v = el.value.trim(), words = v.split(/\s+/).filter(Boolean);
  const bad = (words.length >= 12 && words.every((w) => /^[a-z]+$/.test(w))) || /^[5KLc][1-9A-HJ-NP-Za-km-z]{50,51}$/.test(v) || /^(0x)?[0-9a-fA-F]{64}$/.test(v) || /^[xyztuv]prv/.test(v);
  if (bad) el.value = '';
  el.classList.toggle('bad', bad);
  let err = el.parentElement.querySelector('.err');
  if (bad && !err) { err = document.createElement('div'); err.className = 'err'; err.textContent = 'That looks like a seed phrase or private key. MoolaKata never accepts one, and nothing was saved: enter an extended public key (xpub, ypub or zpub) or addresses instead.'; el.after(err); }
  if (!bad && err && el.value) err.remove();
});
document.addEventListener('mousemove', chartHover);
document.addEventListener('keydown', (e) => {
  if (e.key === 'F1') { e.preventDefault(); state.help = !state.help; render(); }
  if (e.key === 'Escape') {
    const c = document.querySelector('.scrim.confirm');
    if (c) { c.remove(); return; }
    closeMenu(); leaveDialog();
  }
});
addEventListener('hashchange', () => { closeDialog(); render(); helpFor(null); });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
render(); helpFor(null);
</script>
</body>
</html>
