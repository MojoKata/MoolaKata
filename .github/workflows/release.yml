# Releases (requirements S17.8.1, S17.8.2, S17.10). On a v<version> tag: both images for amd64
# and arm64, each built and smoke-run natively on a runner of its architecture, pushed to
# ghcr.io under the repository's owner, joined into one tag per image, and attested (build
# provenance, Sigstore); then copied to Docker Hub with the same digests, and the GitHub
# release drafted with the tag's install files, for a maintainer to publish with its notes
# (docs/RELEASE.md §8). On a pull request that touches
# what goes into the images: the same builds and smoke runs, and nothing is pushed.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - web/install/**
      - web/server/uv.lock
      - connector/Dockerfile
      - connector/requirements.txt

permissions:
  contents: read

jobs:
  build:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag names this version
        if: github.event_name == 'push'
        run: test "v$(cat web/VERSION)" = "$GITHUB_REF_NAME"
      # The help guides' screenshots aren't committed: main's check run of this commit made them
      # from the app (S12.7.5), and the image serves them. A tag on a commit main's check hasn't
      # passed has none to take, and stops here.
      - name: the help guides' screenshots, from main's check run of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow check --branch main \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run" || { echo "main's check hasn't passed on $GITHUB_SHA" >&2; exit 1; }
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n screenshots -D "$RUNNER_TEMP/screenshots"
          mkdir -p web/ui/guides/shots
          cp "$RUNNER_TEMP"/screenshots/guides/shots/*.png web/ui/guides/shots/
          ls web/ui/guides/shots | wc -l
      - name: smoke run, the release gate (S17.8.1)
        run: web/install/smoke.sh
      - name: push the smoke-tested images, tagged by architecture
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat web/VERSION)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in moolakata moolakata-connector; do
            docker tag "$image:$version-smoke" "ghcr.io/$owner/$image:$version-${{ matrix.arch }}"
            docker push --quiet "ghcr.io/$owner/$image:$version-${{ matrix.arch }}"
          done

  publish:
    name: one tag per image, attested
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: join the architectures under the version's tag
        id: join
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          for image in moolakata moolakata-connector; do
            ref="ghcr.io/$owner/$image"
            docker buildx imagetools create -t "$ref:$version" "$ref:$version-amd64" "$ref:$version-arm64"
            digest="$(docker buildx imagetools inspect "$ref:$version" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${image//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: attest the server's image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.join.outputs.registry }}/moolakata
          subject-digest: ${{ steps.join.outputs.moolakata }}
          push-to-registry: false
      - name: attest the connector's image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.join.outputs.registry }}/moolakata-connector
          subject-digest: ${{ steps.join.outputs.moolakata_connector }}
          push-to-registry: false

  docker-hub:
    name: the images copied to Docker Hub
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The environment holds Docker Hub's token and lets only v* tags read it (GENESIS.md §5).
    environment: docker-hub
    permissions:
      contents: read
      packages: read
    steps:
      # The joined images, copied as they are: the same digests, so the attestations made
      # for ghcr.io verify the copies too.
      - name: copy both images, their digests unchanged
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$HUB_USER" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::warning::Docker Hub isn't set up (docs/GENESIS.md §5): nothing copied"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$HUB_TOKEN" | docker login docker.io -u "$HUB_USER" --password-stdin
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          for image in moolakata moolakata-connector; do
            from="ghcr.io/$owner/$image:$version" to="docker.io/$owner/$image:$version"
            docker buildx imagetools create -t "$to" "$from"
            test "$(digest "$to")" = "$(digest "$from")"
          done

  draft:
    name: the release drafted, with the tag's install files
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A draft is seen only by people with write access and isn't locked until it is
      # published, so testers see nothing yet. A rerun replaces the draft an earlier run made.
      - name: draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "MoolaKata ${tag#v}" \
            --notes "Drafted by the release workflow: a maintainer publishes it with its notes." \
            web/install/compose*.yaml web/install/moolakata.toml web/install/proxy/*
