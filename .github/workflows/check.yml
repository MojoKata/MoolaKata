# web/check on every pull request and every push to main (requirements S17.10), on GitHub's
# standard runners, free for a public repository: its parts as jobs side by side, and `check`,
# the status the rulesets require, passing when every part does. The actions are pinned by commit and listed
# in the register (docs/dependencies.md); everything else is the repository's own scripts.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main queue instead, so each
# coverage site is built on the one before it.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The server's tests in three parts side by side (MK_TEST_PART: every third test), with the
  # static checks in the first and the connector's tests in the last.
  tests:
    name: server tests ${{ matrix.part }} of 3 (${{ matrix.parts }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            parts: static server
          - part: 2
            parts: server
          - part: 3
            parts: server connector
    env:
      MK_TEST_PART: ${{ matrix.part }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: uv, pinned with its hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet --require-hashes -r web/install/build-requirements.txt
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: web/dev.sh setup (Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check ${{ matrix.parts }}
        run: |
          set -o pipefail
          web/check ${{ matrix.parts }} 2>&1 | tee "$RUNNER_TEMP/check.log"
      # A process the tests started writes its coverage as it exits: it is waited for, so
      # what it measured is in the artifact.
      - name: the tests' processes, finished
        if: always()
        run: |
          ps -eo pid,etimes,args | grep "[w]eb/server/.venv" || true
          for _ in $(seq 120); do pgrep -f "web/server/.venv" >/dev/null || break; sleep 1; done
          ls -a web/.dev/coverage/server | grep -c '^\.coverage' || true
      # What the tests measured, for the coverage job (S17.5.8).
      - name: the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-tests-${{ matrix.part }}
          path: web/.dev/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The browser tests in two parts side by side, each on four workers.
  browser:
    name: browser tests ${{ matrix.part }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      MK_TEST_PART: ${{ matrix.part }}/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: uv, pinned with its hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet --require-hashes -r web/install/build-requirements.txt
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: web/dev.sh setup (Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check browser
        run: |
          set -o pipefail
          web/check browser 2>&1 | tee "$RUNNER_TEMP/check.log"
      # A process the tests started writes its coverage as it exits: it is waited for, so
      # what it measured is in the artifact.
      - name: the tests' processes, finished
        if: always()
        run: |
          ps -eo pid,etimes,args | grep "[w]eb/server/.venv" || true
          for _ in $(seq 120); do pgrep -f "web/server/.venv" >/dev/null || break; sleep 1; done
          ls -a web/.dev/coverage/server | grep -c '^\.coverage' || true
      # What the tests measured, for the coverage job (S17.5.8).
      - name: the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-browser-${{ matrix.part }}
          path: web/.dev/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  mockups:
    name: mockups
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: uv, pinned with its hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet --require-hashes -r web/install/build-requirements.txt
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: web/dev.sh setup (Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check mockups
        run: |
          set -o pipefail
          web/check mockups 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The coverage of every test job together: totals by area, the changed lines, the floor.
  coverage:
    name: coverage
    needs: [tests, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: uv, pinned with its hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --quiet --require-hashes -r web/install/build-requirements.txt
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: web/dev.sh setup (Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: the test jobs' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: web/.dev/coverage/
          merge-multiple: true
      - name: web/check coverage
        run: |
          echo "coverage data: $(ls -a web/.dev/coverage/server | grep -c '^\.coverage') server files, $(ls web/.dev/coverage/js | wc -l) browser app files"
          set -o pipefail
          web/check coverage 2>&1 | tee "$RUNNER_TEMP/check.log"
      # The coverage reports as HTML (S17.5.8); web/check writes the summary and annotations.
      - name: coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: web/.dev/coverage/html/
          if-no-files-found: ignore
          retention-days: 30
      # On main, the coverage site (S17.5.8): this run's reports, and its totals added to the
      # history the published site holds; the coverage site job publishes it.
      - name: coverage site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd web/server && uv run --frozen --quiet python -m moolakata.dev.coverage site
      - name: the coverage site, for the next job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/.dev/coverage/site/
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The status the rulesets require (docs/GENESIS.md): passing only when every part did.
  check:
    name: check
    needs: [tests, browser, mockups, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "tests, browser, mockups, coverage: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # The coverage site to the repository's GitHub Pages, after a passing check on main. Its
  # environment, github-pages, takes deployments from main alone.
  coverage-site:
    name: coverage site
    needs: [check, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
