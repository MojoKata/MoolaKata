# web/check on every pull request and every push to main (requirements S17.10), on GitHub's
# standard runners, free for a public repository: its parts as jobs side by side, and `check`,
# the status the rulesets require, passing when every part does. The actions are pinned by commit and listed
# in the register (docs/dependencies.md); everything else is the repository's own scripts.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main queue instead, so each
# coverage site is built on the one before it.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request changes, for a part that runs only when it changes (S17.10.1): the
  # ui-kit's job. On main every part runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kit: ${{ steps.kit.outputs.kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base: their difference is
          # what the pull request changes.
          fetch-depth: 2
      - name: whether the ui-kit changed
        id: kit
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "kit=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          # The kit, what it loads (the vendored libraries), and what runs its checks.
          if grep -qE '^(web/ui/kit/|web/ui/vendor/|web/check$|web/dev\.sh$|web/server/uv\.lock$|\.github/workflows/check\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "kit=true" >> "$GITHUB_OUTPUT"
          else
            echo "kit=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # The server's tests in seven parts side by side (MK_TEST_PART, split by measured time:
  # tests/parts.py), with the static checks in the first and the connector's tests in the last.
  tests:
    name: server tests ${{ matrix.part }} of 7 (${{ matrix.parts }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            parts: static server
          - part: 2
            parts: server
          - part: 3
            parts: server
          - part: 4
            parts: server
          - part: 5
            parts: server
          - part: 6
            parts: server
          - part: 7
            parts: server connector
    env:
      MK_TEST_PART: ${{ matrix.part }}/7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: coworker status, unattended (installs what the machine lacks for MoolaKata)
        run: COWORKER_UNATTENDED=1 coworker/bin/coworker status
      - name: web/dev.sh setup (uv, Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check ${{ matrix.parts }}
        env:
          MK_DURATIONS: ${{ runner.temp }}/durations/tests-${{ matrix.part }}.json
        run: |
          set -o pipefail
          web/check ${{ matrix.parts }} 2>&1 | tee "$RUNNER_TEMP/check.log"
      # A process the tests started writes its coverage as it exits: it is waited for, so
      # what it measured is in the artifact.
      - name: the tests' processes, finished
        if: always()
        run: |
          ps -eo pid,etimes,args | grep "[w]eb/server/.venv" || true
          for _ in $(seq 120); do pgrep -f "web/server/.venv" >/dev/null || break; sleep 1; done
          ls -a web/.dev/coverage/server | grep -c '^\.coverage' || true
      # What the tests measured, for the coverage job (S17.5.8).
      - name: the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-tests-${{ matrix.part }}
          path: web/.dev/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # What each test took, for `web/dev.sh ci-durations` (the parts' split by time).
      - name: the tests' times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-tests-${{ matrix.part }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 30
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The browser tests in four parts side by side, each on four workers.
  browser:
    name: browser tests ${{ matrix.part }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      MK_TEST_PART: ${{ matrix.part }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: coworker status, unattended (installs what the machine lacks for MoolaKata)
        run: COWORKER_UNATTENDED=1 coworker/bin/coworker status
      - name: web/dev.sh setup (uv, Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check browser
        env:
          MK_DURATIONS: ${{ runner.temp }}/durations/browser-${{ matrix.part }}.json
        run: |
          set -o pipefail
          web/check browser 2>&1 | tee "$RUNNER_TEMP/check.log"
      # A process the tests started writes its coverage as it exits: it is waited for, so
      # what it measured is in the artifact.
      - name: the tests' processes, finished
        if: always()
        run: |
          ps -eo pid,etimes,args | grep "[w]eb/server/.venv" || true
          for _ in $(seq 120); do pgrep -f "web/server/.venv" >/dev/null || break; sleep 1; done
          ls -a web/.dev/coverage/server | grep -c '^\.coverage' || true
      # What the tests measured, for the coverage job (S17.5.8).
      - name: the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-browser-${{ matrix.part }}
          path: web/.dev/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # What each test took, for `web/dev.sh ci-durations` (the parts' split by time).
      - name: the tests' times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-browser-${{ matrix.part }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore
          retention-days: 30
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The mockups side by side: the generated one's drift, and the hand-written one's screens.
  mockups:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [app-mockup, hand-mockup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: coworker status, unattended (installs what the machine lacks for MoolaKata)
        run: COWORKER_UNATTENDED=1 coworker/bin/coworker status
      - name: web/dev.sh setup (uv, Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check ${{ matrix.part }}
        run: |
          set -o pipefail
          web/check ${{ matrix.part }} 2>&1 | tee "$RUNNER_TEMP/check.log"
      # The mockup generated from the app (S12.9), kept as the file itself, so its link opens
      # or saves the page; main's is published with the coverage site.
      - name: the generated mockup
        id: mockup
        if: matrix.part == 'app-mockup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/mockups/MoolaKata-app.html
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: the generated mockup's link, in the run's summary
        if: matrix.part == 'app-mockup'
        env:
          URL: ${{ steps.mockup.outputs.artifact-url }}
        run: echo "**The mockup generated from the app:** [MoolaKata-app.html]($URL)" >> "$GITHUB_STEP_SUMMARY"
      # The hand-written mockup as this commit has it, kept the same way, so a pull request's
      # design changes open from the run; main's is published with the coverage site.
      - name: the hand-written mockup
        id: hand
        if: matrix.part == 'hand-mockup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: docs/mockups/MoolaKata-mock.html
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: the hand-written mockup's link, in the run's summary
        if: matrix.part == 'hand-mockup'
        env:
          URL: ${{ steps.hand.outputs.artifact-url }}
        run: echo "**The hand-written mockup:** [MoolaKata-mock.html]($URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The ui-kit (S17.3.10): its unit tests and its pages driven in Chromium (S17.5.13), on a pull
  # request only when it changes the kit, on every push to main; its pages, packed into one file,
  # kept as the run's artifact (main's are published with the coverage site).
  ui-kit:
    name: ui-kit
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The commit before too: the coverage of the changed lines counts from it.
          fetch-depth: 2
      - name: coworker status, unattended (installs what the machine lacks for MoolaKata)
        run: COWORKER_UNATTENDED=1 coworker/bin/coworker status
      - name: web/dev.sh setup (uv, Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: web/check kit
        run: |
          set -o pipefail
          web/check kit 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-kit
          path: web/.dev/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: the ui-kit's pages, packed into one file
        run: web/dev.sh kit-pack "$RUNNER_TEMP/kit"
      - name: the ui-kit's pages
        id: pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/kit/kit.html
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: the ui-kit's pages' link, in the run's summary
        env:
          URL: ${{ steps.pages.outputs.artifact-url }}
        run: echo "**The ui-kit's pages:** [kit.html]($URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: the pages' screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-kit-shots
          path: web/.dev/kit-shots/
          if-no-files-found: ignore
          retention-days: 30
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The coverage of every test job together: totals by area, the changed lines, the floor.
  coverage:
    name: coverage
    needs: [tests, browser, ui-kit]
    # The ui-kit's job is skipped on a pull request that leaves the kit alone: its floor isn't
    # held then (the app's tests reach the kit only as far as they use it).
    if: >-
      !cancelled() && needs.tests.result == 'success' && needs.browser.result == 'success' &&
      (needs.ui-kit.result == 'success' || needs.ui-kit.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The commit before too: the coverage of the changed lines counts from it (a pull
          # request's merge commit's first parent is its base).
          fetch-depth: 2
      - name: coworker status, unattended (installs what the machine lacks for MoolaKata)
        run: COWORKER_UNATTENDED=1 coworker/bin/coworker status
      - name: web/dev.sh setup (uv, Python 3.14, Deno and Chromium, each pinned)
        run: web/dev.sh setup
      - name: the test jobs' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: web/.dev/coverage/
          merge-multiple: true
      - name: web/check coverage
        env:
          MK_KIT_TESTED: ${{ needs.ui-kit.result == 'success' && '1' || '0' }}
        run: |
          echo "coverage data: $(ls -a web/.dev/coverage/server | grep -c '^\.coverage') server files, $(ls web/.dev/coverage/js | wc -l) browser app files"
          set -o pipefail
          web/check coverage 2>&1 | tee "$RUNNER_TEMP/check.log"
      # The coverage reports as HTML and as data (S17.5.8); web/check writes the summary and
      # annotations.
      - name: coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          # The reports, and their data to query: each file's lines and branches missed.
          path: |
            web/.dev/coverage/html/
            web/.dev/coverage/server.json
            web/.dev/coverage/browser.lcov
          if-no-files-found: ignore
          retention-days: 30
      # On main, the coverage site (S17.5.8): this run's reports, and its totals added to the
      # history the published site holds; the coverage site job publishes it.
      - name: coverage site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          WEB="$PWD/web" && . web/uv-path
          cd web/server && uv run --frozen --quiet python -m moolakata.dev.coverage site
      - name: the coverage site, for the next job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-site
          path: web/.dev/coverage/site/
          retention-days: 1
      - name: say what failed
        if: failure()
        run: python3 web/check-failures.py "$RUNNER_TEMP/check.log"

  # The status the rulesets require (docs/GENESIS.md): passing only when every part did.
  check:
    name: check
    needs: [changes, tests, browser, ui-kit, mockups, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          KIT: ${{ needs.ui-kit.result }}
          KIT_CHANGED: ${{ needs.changes.outputs.kit }}
        run: |
          echo "changes, tests, browser, ui-kit, mockups, coverage: $RESULTS"
          # The ui-kit's job is skipped only where the kit is unchanged; anything else that isn't
          # a success fails the check.
          for r in $RESULTS; do
            [ "$r" = success ] && continue
            [ "$r" = skipped ] && [ "$KIT" = skipped ] && [ "$KIT_CHANGED" = false ] && continue
            exit 1
          done

  # The coverage site to the repository's GitHub Pages, after a passing check on main, with the
  # mockup the run generated beside the hand-written one (S12.9), and the ui-kit's pages. Its
  # environment, github-pages, takes deployments from main alone.
  coverage-site:
    name: coverage site
    needs: [check, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: the coverage site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-site
          path: site/
      - name: the generated mockup, beside it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MoolaKata-app.html
          path: site/mockup/
      - name: the ui-kit's pages, beside it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit.html
          path: site/kit/
      - name: the ui-kit's pages at /kit/
        run: mv site/kit/kit.html site/kit/index.html
      - name: the site, packed for publishing
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
